<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-GX Music Player</title>

  <!-- SUPABASE JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* VARIABLES DE TEMAS (SKINS DE OPERA GX) */
    :root {
      --gx-bg: #0d0e12;
      --gx-surface: #14161d;
      --gx-surface-card: #1c1e26;
      --gx-accent: #ff0055;
      --gx-accent-glow: rgba(255, 0, 85, 0.4);
      --gx-text: #ffffff;
      --gx-text-muted: #8e94a0;
      --gx-border: #2a2e3d;
      --gx-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* SKINS POPULARES DE OPERA GX */
    body.skin-purple-haze {
      --gx-accent: #9d4edd;
      --gx-accent-glow: rgba(157, 78, 221, 0.4);
    }
    body.skin-ultraviolet {
      --gx-accent: #00f0ff;
      --gx-accent-glow: rgba(0, 240, 255, 0.4);
    }
    body.skin-frankenstein {
      --gx-accent: #00ff66;
      --gx-accent-glow: rgba(0, 255, 102, 0.4);
    }
    body.skin-gold {
      --gx-accent: #e0a96d;
      --gx-accent-glow: rgba(224, 169, 109, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--gx-font);
    }

    body {
      background-color: var(--gx-bg);
      color: var(--gx-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Malla de fondo sin intercepción de clics */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(var(--gx-border) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.3;
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      width: 95%;
      max-width: 520px;
      z-index: 20; /* Eleva el contenedor por encima del fondo */
      margin: 20px auto;
      position: relative;
    }

    /* BARRA NAVEGACIÓN ESTILO GX TAB */
    .navbar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-left: 3px solid var(--gx-accent);
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 30;
    }

    .nav-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* SELECTOR DE SKINS OPERA GX */
    .skin-select {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .skin-select:hover, .skin-select:focus {
      border-color: var(--gx-accent);
      box-shadow: 0 0 8px var(--gx-accent-glow);
    }

    .menu-btn {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      border-color: var(--gx-accent);
      color: var(--gx-accent);
      box-shadow: 0 0 10px var(--gx-accent-glow);
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      min-width: 180px;
      z-index: 100;
      border-radius: 4px;
      overflow: hidden;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 10px 14px;
      color: var(--gx-text-muted);
      cursor: pointer;
      border-bottom: 1px solid var(--gx-border);
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .dropdown-item:hover {
      background: var(--gx-surface-card);
      color: var(--gx-accent);
      padding-left: 18px;
    }

    .submenu { display: none; padding-left: 10px; background: rgba(0,0,0,0.3); }
    .submenu.show { display: block; }

    /* ========================================================= */
    /* PANTALLA DE AUTENTICACIÓN                                 */
    /* ========================================================= */
    .auth-box {
      background: rgba(10, 10, 20, 0.95);
      border: 2px solid #ff0055;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
      text-align: center;
      position: relative;
      z-index: 50; /* Prioridad máxima para asegurar respuesta de clics */
    }

    .cyber-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #000;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      outline: none;
      border-radius: 4px;
      position: relative;
      z-index: 51;
    }

    .neon-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
      position: relative;
      z-index: 51;
    }

    .neon-btn:hover {
      opacity: 0.9;
    }

    .auth-msg {
      font-size: 0.75rem;
      margin-top: 10px;
      min-height: 18px;
    }
    .auth-msg.error { color: #ff3355; }
    .auth-msg.success { color: #00ff66; }
    /* ========================================================= */

    /* REPRODUCTOR PRINCIPAL - OPERA GX PANEL */
    .main-player-container {
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      padding: 18px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 15px;
      position: relative;
      z-index: 30;
    }

    .main-player-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--gx-accent), transparent);
    }

    .visualizer-wrapper {
      width: 100%;
      height: 80px;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      margin-bottom: 12px;
      position: relative;
      border-radius: 3px;
      overflow: hidden;
    }

    #visualizer { width: 100%; height: 100%; }

    .vu-meter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
      font-size: 0.65rem;
      color: var(--gx-text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .vu-track {
      flex: 1;
      height: 4px;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .vu-fill {
      height: 100%;
      width: 0%;
      background: var(--gx-accent);
      box-shadow: 0 0 8px var(--gx-accent);
      transition: width 0.05s linear;
    }

    .lyrics-display {
      min-height: 32px;
      font-size: 0.8rem;
      color: var(--gx-accent);
      text-align: center;
      margin: 8px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
    }

    .info-display { text-align: center; margin-bottom: 12px; }
    
    .player-title { 
      font-weight: 700; 
      color: var(--gx-text); 
      font-size: 1rem; 
      letter-spacing: 0.5px;
    }
    
    .player-artist { 
      font-size: 0.8rem; 
      color: var(--gx-text-muted); 
      margin-top: 2px;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .player-btn {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }

    .player-btn:hover {
      background: var(--gx-accent);
      border-color: var(--gx-accent);
      color: #fff;
      box-shadow: 0 0 12px var(--gx-accent-glow);
    }

    .file-label-btn {
      display: inline-block;
    }

    .player-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--gx-text-muted);
    }

    .player-progress input[type="range"] {
      flex: 1;
      height: 4px;
      appearance: none;
      background: var(--gx-bg);
      border-radius: 2px;
      outline: none;
    }

    .player-progress input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gx-accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--gx-accent);
    }

    .track-list { 
      list-style: none; 
      margin-top: 12px; 
      max-height: 200px; 
      overflow-y: auto;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      border-radius: 4px;
      padding: 6px;
    }

    .track-item {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 8px 10px; 
      border-bottom: 1px solid var(--gx-border); 
      font-size: 0.8rem;
      background: var(--gx-surface);
      margin-bottom: 4px;
      border-radius: 2px;
      transition: border-color 0.2s ease;
    }

    .track-item:hover {
      border-left: 2px solid var(--gx-accent);
      background: var(--gx-surface-card);
    }

    .track-meta { 
      cursor: pointer; 
      flex: 1; 
      color: var(--gx-text);
      font-weight: 500;
    }

    .track-actions { display: flex; gap: 6px; }

    .action-btn { 
      background: var(--gx-bg); 
      border: 1px solid var(--gx-border); 
      color: var(--gx-text-muted); 
      font-size: 0.7rem; 
      cursor: pointer; 
      padding: 4px 8px;
      border-radius: 2px;
    }

    .action-btn:hover {
      border-color: var(--gx-accent);
      color: var(--gx-accent);
    }

    .action-btn.danger:hover { 
      border-color: #ff3333; 
      color: #ff3333; 
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- BARRA NAVEGACIÓN -->
    <nav class="navbar" id="navbar">
      <span style="font-weight: bold; font-size: 0.9rem; letter-spacing: 1px;">GX//PLAYER</span>
      
      <div class="nav-controls">
        <select id="gx-skin-selector" class="skin-select" onchange="changeGxSkin(this.value)">
          <option value="default">GX Red</option>
          <option value="skin-purple-haze">Purple Haze</option>
          <option value="skin-ultraviolet">Ultraviolet</option>
          <option value="skin-frankenstein">Frankenstein</option>
          <option value="skin-gold">Gold</option>
        </select>

        <div class="dropdown">
          <button class="menu-btn" onclick="toggleMenu()">MENÚ ▼</button>
          <div class="dropdown-menu" id="dropdown-menu">
            <div class="dropdown-item" onclick="toggleSubmenu('sub-eq')">Ecualizador</div>
            <div id="sub-eq" class="submenu">
              <div class="dropdown-item">Preset: Flat</div>
              <div class="dropdown-item">Preset: Bass Boost</div>
            </div>
            <div class="dropdown-item" onclick="logout()">Cerrar Sesión</div>
          </div>
        </div>
      </div>
    </nav>

    <!-- FORMULARIO DE AUTH SUPABASE (CON Z-INDEX ELEVADO) -->
    <div class="auth-box" id="auth-box">
      <h2 style="color: #ff0055; margin-bottom: 15px;">LOGIN SYSTEM</h2>
      <input type="email" class="cyber-input" placeholder="Correo electrónico" id="email">
      <input type="password" class="cyber-input" placeholder="Contraseña" id="password">
      
      <div style="margin-top: 10px;">
        <button type="button" class="neon-btn" onclick="login()">INGRESAR</button>
        <button type="button" class="neon-btn" style="background: transparent; border: 1px solid #ff0055;" onclick="signUp()">REGISTRAR</button>
      </div>

      <div class="auth-msg" id="auth-msg"></div>
    </div>

    <!-- REPRODUCTOR PRINCIPAL -->
    <div class="main-player-container" id="main-player" style="display:none;">
      <div class="visualizer-wrapper">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="vu-meter-bar">
        <span>VU</span>
        <div class="vu-track"><div class="vu-fill" id="vu-fill"></div></div>
      </div>

      <div class="info-display">
        <div class="player-title" id="player-title">Sin reproducción</div>
        <div class="player-artist" id="player-artist">Selecciona una pista</div>
      </div>

      <div class="lyrics-display" id="lyrics-display">-- GX AUDIO ENGINE --</div>

      <div class="player-controls">
        <button class="player-btn">◀◀</button>
        <button class="player-btn">▶</button>
        <button class="player-btn">██</button>
        <button class="player-btn">▶▶</button>
        
        <label for="file-input" class="player-btn file-label-btn">+ ARCHIVOS</label>
        <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
      </div>

      <div class="player-progress">
        <span>00:00</span>
        <input type="range" value="0" min="0" max="100">
        <span>00:00</span>
      </div>

      <ul class="track-list" id="track-list">
        <li class="track-item">
          <div class="track-meta">Demo_Track_01.mp3</div>
          <div class="track-actions">
            <button class="action-btn">▶</button>
            <button class="action-btn danger">✕</button>
          </div>
        </li>
      </ul>
    </div>

  </div>

  <script>
    // INICIALIZACIÓN DE SUPABASE
    const SUPABASE_URL = "https://cwpjjzamawyywfcsnaqo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // CONTROL DE ESTADO DE SESIÓN EN TIEMPO REAL
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        showPlayerUI();
      } else {
        showAuthUI();
      }
    });

    // INICIAR SESIÓN CON CORREO Y CONTRASEÑA
    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgBox = document.getElementById('auth-msg');

      if (!email || !password) {
        msgBox.className = 'auth-msg error';
        msgBox.textContent = 'Por favor ingresa correo y contraseña.';
        return;
      }

      msgBox.className = 'auth-msg';
      msgBox.textContent = 'Autenticando...';

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        msgBox.className = 'auth-msg error';
        msgBox.textContent = error.message;
      } else {
        msgBox.className = 'auth-msg success';
        msgBox.textContent = 'Acceso concedido.';
      }
    }

    // REGISTRO DE NUEVO USUARIO
    async function signUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgBox = document.getElementById('auth-msg');

      if (!email || !password) {
        msgBox.className = 'auth-msg error';
        msgBox.textContent = 'Por favor ingresa correo y contraseña.';
        return;
      }

      msgBox.className = 'auth-msg';
      msgBox.textContent = 'Registrando usuario...';

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        msgBox.className = 'auth-msg error';
        msgBox.textContent = error.message;
      } else {
        msgBox.className = 'auth-msg success';
        msgBox.textContent = 'Registro exitoso. Revisa tu correo de confirmación si está activado.';
      }
    }

    // CERRAR SESIÓN
    async function logout() {
      await supabase.auth.signOut();
    }

    // CONTROL DE INTERFAZ
    function showPlayerUI() {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('main-player').style.display = 'block';
      document.getElementById('navbar').style.display = 'flex';
    }

    function showAuthUI() {
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('main-player').style.display = 'none';
      document.getElementById('navbar').style.display = 'none';
    }

    // GESTIÓN DE SKINS OPERA GX
    function changeGxSkin(skinClass) {
      document.body.className = ''; 
      if (skinClass !== 'default') {
        document.body.classList.add(skinClass);
      }
    }

    function toggleMenu() {
      document.getElementById('dropdown-menu').classList.toggle('show');
    }

    function toggleSubmenu(id) {
      document.getElementById(id).classList.toggle('show');
    }
  </script>
</body>
</html>
