<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicApp Pro</title>
  
  <!-- Fuente Cyberpunk / Modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- SDK Cliente Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lector de Metadatos ID3 / Tags -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Orbitron', monospace, sans-serif; 
    }

    body {
      background-color: #030305;
      color: #00f3ff; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    /* RUIDO DE TV ANALÓGICA EN EL FONDO */
    #tv-static-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.18; /* Ajusta la intensidad del ruido aquí */
      display: block;
    }

    /* Fondo degradado por defecto al iniciar sesión */
    body.logged-in {
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
    }

    /* Scanlines CRT */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 1;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.85) 100%);
      box-shadow: inset 0 0 80px rgba(0, 243, 255, 0.05);
      z-index: 1;
      pointer-events: none;
    }

    /* NAVBAR */
    .navbar {
      width: 100%;
      background: rgba(10, 10, 18, 0.95);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0, 243, 255, 0.1);
    }

    .nav-brand {
      font-size: 1.1rem;
      font-weight: 900;
      color: #00f3ff;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
      cursor: pointer;
    }

    .nav-menu-container { position: relative; }

    .nav-icon-btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 48px;
      background: rgba(10, 10, 18, 0.95);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 8px;
      width: 200px;
      backdrop-filter: blur(12px);
      z-index: 1001;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 12px 16px;
      font-size: 0.75rem;
      color: #ffffff;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-item:hover { background: rgba(0, 243, 255, 0.15); color: #00f3ff; }
    .dropdown-item.danger { color: #ff0055; }
    .dropdown-item.danger:hover { background: rgba(255, 0, 85, 0.15); }

    /* CONTENEDOR PRINCIPAL Y CENTRADO DE LOGIN */
    .app-container {
      width: 100%;
      max-width: 460px;
      padding: 20px 16px;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ESTADO DESCONECTADO: Centra la auth-card en medio de la pantalla */
    body:not(.logged-in) .app-container {
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 90px);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: rgba(10, 10, 18, 0.88); 
      backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 0, 85, 0.4); 
      border-radius: 16px; 
      padding: 28px 24px;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
      text-align: center;
    }

    .view-card {
      background: rgba(10, 10, 18, 0.85); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(0, 243, 255, 0.3); 
      border-radius: 16px; 
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
    }

    /* ANIMACIÓN GLITCH DE LOGIN */
    .glitch-effect { animation: cyberGlitch 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }

    @keyframes cyberGlitch {
      0% { transform: translate(0); box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
      20% { transform: translate(-4px, 3px); box-shadow: -4px 0 #00f3ff, 4px 0 #ff0055; }
      40% { transform: translate(4px, -3px); box-shadow: 4px 0 #00f3ff, -4px 0 #ff0055; }
      60% { transform: translate(-2px, 1px); box-shadow: -2px 0 #ff0055, 2px 0 #00f3ff; }
      80% { transform: translate(2px, -1px); box-shadow: 2px 0 #00f3ff, -2px 0 #ff0055; }
      100% { transform: translate(0); box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }
    }

    .neon-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: 0.8rem;
      margin-bottom: 14px;
      outline: none;
    }

    .neon-input:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .neon-btn {
      background: rgba(0, 243, 255, 0.1);
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .neon-btn:hover { background: rgba(0, 243, 255, 0.25); }

    .neon-btn-secondary {
      background: rgba(255, 0, 85, 0.1);
      color: #ff0055;
      border: 1px solid #ff0055;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .neon-btn-secondary:hover { background: rgba(255, 0, 85, 0.25); }

    /* TITULOS DE SECCIÓN */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding-bottom: 6px;
    }

    .section-title { font-size: 0.8rem; color: #ff0055; letter-spacing: 1px; }

    /* LISTAS Y ELEMENTOS */
    .track-list { list-style: none; }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.7rem;
    }

    .track-item:hover { border-color: rgba(0, 243, 255, 0.4); }
    .track-meta { flex: 1; overflow: hidden; margin-right: 8px; cursor: pointer; }
    .track-name { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist-sub { color: rgba(0, 243, 255, 0.6); font-size: 0.6rem; }
    .track-actions { display: flex; gap: 6px; }

    .action-btn {
      background: transparent;
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #00f3ff;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.65rem;
      cursor: pointer;
    }

    .action-btn.danger { border-color: #ff0055; color: #ff0055; }

    /* PLAYLIST CARDS */
    .playlist-card-item {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .playlist-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .playlist-card-title { font-size: 0.8rem; color: #00f3ff; font-weight: bold; }

    /* VISUALIZADOR Y EQ */
    .visualizer-wrapper {
      width: 100%;
      height: 90px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(5, 5, 12, 0.9);
    }

    #visualizer { width: 100%; height: 100%; display: block; }

    .eq-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .eq-sliders { display: flex; justify-content: space-between; gap: 8px; }
    .eq-band { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .eq-band label { font-size: 0.55rem; color: #00f3ff; margin-bottom: 2px; }
    .eq-band input[type="range"] { -webkit-appearance: none; width: 100%; background: #12121c; height: 4px; }
    .eq-band input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 100px; height: 10px; border-radius: 50%; background: #00f3ff; cursor: pointer; }

    /* REPRODUCTOR FLOTANTE */
    .floating-player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(8, 8, 14, 0.95);
      border-top: 1px solid rgba(0, 243, 255, 0.4);
      backdrop-filter: blur(15px);
      padding: 10px 16px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.8);
    }

    .floating-info { display: flex; justify-content: space-between; align-items: center; }
    .floating-title { font-size: 0.75rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .floating-artist { font-size: 0.6rem; color: rgba(0, 243, 255, 0.7); }
    .floating-controls { display: flex; align-items: center; gap: 8px; justify-content: center; }
    .floating-btn { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; border-radius: 6px; padding: 4px 10px; font-size: 0.7rem; cursor: pointer; }

    .floating-progress { display: flex; align-items: center; gap: 8px; font-size: 0.55rem; color: #00f3ff; }
    .floating-progress input[type="range"] { flex: 1; -webkit-appearance: none; background: #12121c; height: 3px; }
    .floating-progress input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; border-radius: 50%; background: #ff0055; cursor: pointer; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #0d0d14;
      border: 1px solid #00f3ff;
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <!-- CANVAS RUIDO DE TV ANALÓGICA -->
  <canvas id="tv-static-canvas"></canvas>

  <!-- NAVBAR -->
  <header class="navbar" id="app-navbar" style="display: none;">
    <div class="nav-brand" id="nav-brand-title">MusicApp</div>
    <div class="nav-menu-container">
      <button class="nav-icon-btn" id="btn-toggle-menu">⚙</button>
      <div class="dropdown-menu" id="dropdown-menu">
        <div class="dropdown-item" id="menu-library">📂 Mi Biblioteca</div>
        <div class="dropdown-item" id="menu-playlists">🎵 Listas de reproducción</div>
        <div class="dropdown-item danger" id="menu-logout">🚪 Cerrar sesión</div>
      </div>
    </div>
  </header>

  <div class="app-container">

    <!-- LOGIN / REGISTER (CENTRADO AL ESTAR DESCONECTADO) -->
    <div class="auth-card" id="auth-screen">
      <h2 style="font-size: 1.1rem; color: #ff0055; margin-bottom: 18px; letter-spacing: 2px;">SYSTEM//ACCESS</h2>
      <input type="email" id="auth-email" placeholder="CORREO@CYBER.COM" class="neon-input">
      <input type="password" id="auth-password" placeholder="CONTRASEÑA" class="neon-input">
      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <button id="btn-login" class="neon-btn" style="flex: 1;">LOGIN</button>
        <button id="btn-signup" class="neon-btn-secondary" style="flex: 1;">REGISTRAR</button>
      </div>
      <p id="auth-status" style="font-size: 0.65rem; color: #ff0055; margin-top: 12px; min-height: 15px;"></p>
    </div>

    <!-- VISTA: MI BIBLIOTECA -->
    <div class="view-card" id="view-library" style="display: none;">
      <div class="visualizer-wrapper">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="eq-container">
        <div style="font-size: 0.6rem; color: #ff0055; text-align: center; margin-bottom: 6px;">⚡ HARDWARE EQ // 3 BANDAS</div>
        <div class="eq-sliders">
          <div class="eq-band">
            <label>LOW</label>
            <input type="range" id="eq-low" min="-12" max="12" value="0">
          </div>
          <div class="eq-band">
            <label>MID</label>
            <input type="range" id="eq-mid" min="-12" max="12" value="0">
          </div>
          <div class="eq-band">
            <label>HIGH</label>
            <input type="range" id="eq-high" min="-12" max="12" value="0">
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 14px;">
        <label for="file-input" class="neon-btn-secondary" style="display: block; cursor: pointer;">⚡ SUBIR AUDIO A LA NUBE (.WAV / .FLAC)</label>
        <input type="file" id="file-input" accept="audio/*,.wav,.flac,.mp3" multiple style="display: none;">
        <p id="upload-status" style="font-size: 0.6rem; color: #00f3ff; margin-top: 4px;"></p>
      </div>

      <div class="section-header">
        <span class="section-title">📂 ARCHIVOS EN LA NUBE</span>
      </div>
      <ul class="track-list" id="library-track-list"></ul>
    </div>

    <!-- VISTA: PLAYLISTS -->
    <div class="view-card" id="view-playlists" style="display: none;">
      <div class="section-header">
        <span class="section-title">🎵 TUS PLAYLISTS</span>
        <button class="action-btn" id="btn-create-playlist">+ NUEVA</button>
      </div>

      <div id="playlists-container"></div>
    </div>

  </div>

  <!-- REPRODUCTOR FLOTANTE PERSISTENTE -->
  <div class="floating-player" id="floating-player" style="display: none;">
    <div class="floating-info">
      <div>
        <div class="floating-title" id="float-track-title">SELECCIONA PISTA</div>
        <div class="floating-artist" id="float-track-artist">SYSTEM//READY</div>
      </div>
      <div class="floating-controls">
        <button class="floating-btn" id="btn-float-prev">⏮</button>
        <button class="floating-btn" id="btn-float-play">▶</button>
        <button class="floating-btn" id="btn-float-next">⏭</button>
      </div>
    </div>
    <div class="floating-progress">
      <span id="float-current-time">0:00</span>
      <input type="range" id="float-progress-bar" value="0" min="0" step="0.1">
      <span id="float-total-duration">0:00</span>
    </div>
  </div>

  <!-- MODAL AGREGAR A PLAYLIST -->
  <div class="modal-overlay" id="modal-add-playlist">
    <div class="modal-content">
      <div class="section-title" style="margin-bottom: 10px;">AÑADIR A PLAYLIST</div>
      <div id="modal-playlist-options"></div>
      <button class="neon-btn-secondary" id="btn-close-modal" style="width: 100%; margin-top: 10px;">CANCELAR</button>
    </div>
  </div>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script>
    // ----------------------------------------------------
    // GENERADOR DE RUIDO / ESTÁTICA DE TV ANALÓGICA
    // ----------------------------------------------------
    const staticCanvas = document.getElementById("tv-static-canvas");
    const staticCtx = staticCanvas.getContext("2d");
    let staticAnimationId = null;

    function resizeStaticCanvas() {
      staticCanvas.width = window.innerWidth / 2; // Escala reducida para estilo pixel/retro
      staticCanvas.height = window.innerHeight / 2;
    }
    window.addEventListener("resize", resizeStaticCanvas);
    resizeStaticCanvas();

    function generateTVStatic() {
      const width = staticCanvas.width;
      const height = staticCanvas.height;
      const imgData = staticCtx.createImageData(width, height);
      const buffer = new Uint32Array(imgData.data.buffer);
      const len = buffer.length;

      for (let i = 0; i < len; i++) {
        const color = Math.random() * 255 | 0;
        // BGRa en little-endian para rendimiento óptimo
        buffer[i] = (255 << 24) | (color << 16) | (color << 8) | color;
      }

      staticCtx.putImageData(imgData, 0, 0);
      staticAnimationId = requestAnimationFrame(generateTVStatic);
    }

    function startTVStatic() {
      if (!staticAnimationId) {
        staticCanvas.style.display = "block";
        generateTVStatic();
      }
    }

    function stopTVStatic() {
      if (staticAnimationId) {
        cancelAnimationFrame(staticAnimationId);
        staticAnimationId = null;
        staticCanvas.style.display = "none";
      }
    }

    // Iniciar el ruido al cargar la página (sesión cerrada por defecto)
    startTVStatic();


    // ----------------------------------------------------
    // SUPABASE CONFIG & LOGIC
    // ----------------------------------------------------
    const SUPABASE_URL = "https://cwpjjzamawyywfcsnaqo.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl"; 
    
    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) { console.error("Error Supabase:", err); }

    let currentUser = null;
    let songs = [];
    let playlists = [];
    let currentQueue = [];
    let currentSongIndex = -1;
    let isPlaying = false;
    let trackToAddToPlaylist = null;

    // DOM ELEMENTS
    const appNavbar = document.getElementById("app-navbar");
    const authScreen = document.getElementById("auth-screen");
    const viewLibrary = document.getElementById("view-library");
    const viewPlaylists = document.getElementById("view-playlists");
    const floatingPlayer = document.getElementById("floating-player");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const audio = document.getElementById("audio-player");

    // ANIMACIÓN GLITCH & NAVEGACIÓN
    function triggerGlitch(element, cb) {
      element.classList.remove("glitch-effect");
      void element.offsetWidth; // Forzar reflow
      element.classList.add("glitch-effect");
      setTimeout(() => { 
        element.classList.remove("glitch-effect"); 
        if(cb) cb(); 
      }, 400);
    }

    function showView(view) {
      viewLibrary.style.display = "none";
      viewPlaylists.style.display = "none";

      if (view === "library") {
        viewLibrary.style.display = "block";
        triggerGlitch(viewLibrary);
      } else if (view === "playlists") {
        viewPlaylists.style.display = "block";
        triggerGlitch(viewPlaylists);
        renderPlaylistsView();
      }
    }

    document.getElementById("btn-toggle-menu").addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("show");
    });
    document.addEventListener("click", () => dropdownMenu.classList.remove("show"));

    document.getElementById("menu-library").addEventListener("click", () => showView("library"));
    document.getElementById("menu-playlists").addEventListener("click", () => showView("playlists"));

    // AUTHENTICATION
    document.getElementById("btn-login").addEventListener("click", async () => {
      triggerGlitch(authScreen, async () => {
        const email = document.getElementById("auth-email").value.trim();
        const password = document.getElementById("auth-password").value.trim();
        if (!email || !password) {
          document.getElementById("auth-status").innerText = "INGRESA EMAIL Y CONTRASEÑA";
          return;
        }
        if (supabaseClient) {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) document.getElementById("auth-status").innerText = error.message;
        }
      });
    });

    document.getElementById("btn-signup").addEventListener("click", async () => {
      triggerGlitch(authScreen, async () => {
        const email = document.getElementById("auth-email").value.trim();
        const password = document.getElementById("auth-password").value.trim();
        if (!email || !password) return;
        if (supabaseClient) {
          const { error } = await supabaseClient.auth.signUp({ email, password });
          document.getElementById("auth-status").innerText = error ? error.message : "¡REGISTRO OK! REVISA TU EMAIL.";
        }
      });
    });

    document.getElementById("menu-logout").addEventListener("click", async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      pauseSong();
    });

    // LISTENER DE SESIÓN
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentUser = session.user;
          document.body.classList.add("logged-in");
          stopTVStatic(); // Apagar ruido de TV
          
          authScreen.style.display = "none";
          appNavbar.style.display = "flex";
          floatingPlayer.style.display = "flex";
          showView("library");
          loadCloudTracks();
        } else {
          currentUser = null;
          document.body.classList.remove("logged-in");
          startTVStatic(); // Activar ruido de TV

          authScreen.style.display = "block";
          appNavbar.style.display = "none";
          viewLibrary.style.display = "none";
          viewPlaylists.style.display = "none";
          floatingPlayer.style.display = "none";
        }
      });
    }

    // CARGA DE CANCIONES
    async function loadCloudTracks() {
      if (!currentUser || !supabaseClient) return;
      const { data } = await supabaseClient.storage.from("audio-tracks").list(currentUser.id, { limit: 100 });
      if (!data) return;

      songs = data.map(file => {
        const filePath = `${currentUser.id}/${file.name}`;
        const { data: publicUrlData } = supabaseClient.storage.from("audio-tracks").getPublicUrl(filePath);
        return {
          id: file.id || filePath,
          fileNameOnServer: filePath,
          title: file.name.replace(/^\d+_/, "").replace(/\.[^/.]+$/, "").replace(/_/g, " "),
          artist: "CLOUD//TRACK",
          src: publicUrlData.publicUrl
        };
      });

      renderLibrary();
    }

    function renderLibrary() {
      const list = document.getElementById("library-track-list");
      list.innerHTML = "";
      songs.forEach((song, i) => {
        const li = document.createElement("li");
        li.className = "track-item";
        li.innerHTML = `
          <div class="track-meta">
            <div class="track-name">${song.title}</div>
            <div class="track-artist-sub">${song.artist}</div>
          </div>
          <div class="track-actions">
            <button class="action-btn" onclick="openAddToPlaylistModal(${i})">+ PLAYLIST</button>
            <button class="action-btn danger" onclick="deleteTrack(${i}, event)">✕</button>
          </div>
        `;
        li.querySelector(".track-meta").addEventListener("click", () => playQueue(songs, i));
        list.appendChild(li);
      });
    }

    // SUBIDA CON METADATOS
    document.getElementById("file-input").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files);
      for (const file of files) {
        document.getElementById("upload-status").innerText = `SUBIENDO: ${file.name}...`;
        let title = file.name.replace(/\.[^/.]+$/, "");
        let artist = "ARTISTA DESCONOCIDO";

        try {
          await new Promise((resolve) => {
            window.jsmediatags.read(file, {
              onSuccess: (tag) => {
                if (tag.tags.title) title = tag.tags.title;
                if (tag.tags.artist) artist = tag.tags.artist;
                resolve();
              },
              onError: () => resolve()
            });
          });
        } catch(e){}

        const sanitized = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
        const filePath = `${currentUser.id}/${Date.now()}_${sanitized}`;

        const { error } = await supabaseClient.storage.from("audio-tracks").upload(filePath, file);
        if (!error) {
          const { data } = supabaseClient.storage.from("audio-tracks").getPublicUrl(filePath);
          songs.push({ id: filePath, fileNameOnServer: filePath, title, artist, src: data.publicUrl });
        }
      }
      document.getElementById("upload-status").innerText = "¡SUBIDA COMPLETADA!";
      renderLibrary();
    });

    async function deleteTrack(index, e) {
      e.stopPropagation();
      const song = songs[index];
      if (confirm(`¿Eliminar "${song.title}"?`)) {
        await supabaseClient.storage.from("audio-tracks").remove([song.fileNameOnServer]);
        songs.splice(index, 1);
        renderLibrary();
      }
    }

    // GESTIÓN DE PLAYLISTS
    document.getElementById("btn-create-playlist").addEventListener("click", () => {
      const name = prompt("Nombre de la nueva lista:");
      if (name && name.trim()) {
        playlists.push({ id: Date.now(), name: name.trim(), tracks: [] });
        renderPlaylistsView();
      }
    });

    function renderPlaylistsView() {
      const container = document.getElementById("playlists-container");
      container.innerHTML = "";

      if (playlists.length === 0) {
        container.innerHTML = `<p style="font-size:0.7rem; color:rgba(255,255,255,0.5);">NO HAY PLAYLISTS CREADAS.</p>`;
        return;
      }

      playlists.forEach((pl, plIndex) => {
        const div = document.createElement("div");
        div.className = "playlist-card-item";
        
        let tracksHTML = pl.tracks.map((t, tIndex) => `
          <div class="track-item" style="margin-bottom:4px;">
            <div class="track-meta" onclick="playQueue(playlists[${plIndex}].tracks, ${tIndex})">
              <div class="track-name">${t.title}</div>
            </div>
            <button class="action-btn danger" onclick="removeTrackFromPlaylist(${plIndex}, ${tIndex})">✕</button>
          </div>
        `).join("");

        div.innerHTML = `
          <div class="playlist-card-header">
            <span class="playlist-card-title">🎵 ${pl.name} (${pl.tracks.length})</span>
            <div>
              <button class="action-btn" onclick="renamePlaylist(${plIndex})">✏️</button>
              <button class="action-btn danger" onclick="deletePlaylist(${plIndex})">🗑️</button>
            </div>
          </div>
          <div>${tracksHTML || '<span style="font-size:0.6rem; color:rgba(255,255,255,0.4);">VACÍA</span>'}</div>
        `;
        container.appendChild(div);
      });
    }

    function renamePlaylist(index) {
      const newName = prompt("Nuevo nombre:", playlists[index].name);
      if (newName && newName.trim()) {
        playlists[index].name = newName.trim();
        renderPlaylistsView();
      }
    }

    function deletePlaylist(index) {
      if (confirm(`¿Eliminar la lista "${playlists[index].name}"?`)) {
        playlists.splice(index, 1);
        renderPlaylistsView();
      }
    }

    function removeTrackFromPlaylist(plIndex, trackIndex) {
      playlists[plIndex].tracks.splice(trackIndex, 1);
      renderPlaylistsView();
    }

    // MODAL PLAYLIST
    function openAddToPlaylistModal(songIndex) {
      trackToAddToPlaylist = songs[songIndex];
      const container = document.getElementById("modal-playlist-options");
      container.innerHTML = "";

      if (playlists.length === 0) {
        container.innerHTML = `<p style="font-size:0.65rem; color:#ff0055;">Crea primero una lista en la sección Playlists.</p>`;
      } else {
        playlists.forEach((pl) => {
          const btn = document.createElement("button");
          btn.className = "neon-btn";
          btn.style.cssText = "width:100%; margin-bottom:6px; text-align:left;";
          btn.innerText = `+ ${pl.name}`;
          btn.onclick = () => {
            if (!pl.tracks.find(t => t.src === trackToAddToPlaylist.src)) {
              pl.tracks.push(trackToAddToPlaylist);
            }
            document.getElementById("modal-add-playlist").style.display = "none";
          };
          container.appendChild(btn);
        });
      }
      document.getElementById("modal-add-playlist").style.display = "flex";
    }

    document.getElementById("btn-close-modal").addEventListener("click", () => {
      document.getElementById("modal-add-playlist").style.display = "none";
    });

    // REPRODUCTOR FLOTANTE
    const btnFloatPlay = document.getElementById("btn-float-play");
    const floatTitle = document.getElementById("float-track-title");
    const floatArtist = document.getElementById("float-track-artist");
    const floatProgressBar = document.getElementById("float-progress-bar");
    const floatCurrentTime = document.getElementById("float-current-time");
    const floatTotalDuration = document.getElementById("float-total-duration");

    function playQueue(queue, index) {
      currentQueue = queue;
      currentSongIndex = index;
      loadSong(currentQueue[currentSongIndex]);
      playSong();
    }

    function loadSong(song) {
      if (!song) return;
      floatTitle.innerText = song.title;
      floatArtist.innerText = song.artist;
      audio.src = song.src;
      audio.load();
    }

    function playSong() {
      initAudioGraph();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      audio.play().then(() => {
        isPlaying = true;
        btnFloatPlay.innerText = "⏸";
      }).catch(() => {
        isPlaying = false;
        btnFloatPlay.innerText = "▶";
      });
    }

    function pauseSong() {
      isPlaying = false;
      btnFloatPlay.innerText = "▶";
      audio.pause();
    }

    btnFloatPlay.addEventListener("click", () => {
      if (currentSongIndex === -1 && songs.length > 0) playQueue(songs, 0);
      else isPlaying ? pauseSong() : playSong();
    });

    document.getElementById("btn-float-next").addEventListener("click", () => {
      if (currentQueue.length === 0) return;
      currentSongIndex = (currentSongIndex + 1) % currentQueue.length;
      loadSong(currentQueue[currentSongIndex]);
      playSong();
    });

    document.getElementById("btn-float-prev").addEventListener("click", () => {
      if (currentQueue.length === 0) return;
      currentSongIndex = (currentSongIndex - 1 + currentQueue.length) % currentQueue.length;
      loadSong(currentQueue[currentSongIndex]);
      playSong();
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        floatProgressBar.value = (audio.currentTime / audio.duration) * 100;
        floatCurrentTime.innerText = formatTime(audio.currentTime);
        floatTotalDuration.innerText = formatTime(audio.duration);
      }
    });

    floatProgressBar.addEventListener("input", () => {
      if (audio.duration) audio.currentTime = (floatProgressBar.value / 100) * audio.duration;
    });

    audio.addEventListener("ended", () => {
      document.getElementById("btn-float-next").click();
    });

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // WEB AUDIO API Y VISUALIZADOR
    const canvas = document.getElementById("visualizer");
    const canvasCtx = canvas.getContext("2d");
    let audioCtx, analyser, sourceNode, lowFilter, midFilter, highFilter, audioGraphInitialized = false;

    function initAudioGraph() {
      if (audioGraphInitialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        lowFilter = audioCtx.createBiquadFilter();
        lowFilter.type = "lowshelf"; lowFilter.frequency.value = 60;

        midFilter = audioCtx.createBiquadFilter();
        midFilter.type = "peaking"; midFilter.frequency.value = 1000; midFilter.Q.value = 1.0;

        highFilter = audioCtx.createBiquadFilter();
        highFilter.type = "highshelf"; highFilter.frequency.value = 10000;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(lowFilter);
        lowFilter.connect(midFilter);
        midFilter.connect(highFilter);
        highFilter.connect(analyser);
        analyser.connect(audioCtx.destination);

        audioGraphInitialized = true;
        drawVisualizer();
      } catch (e) { console.log(e); }
    }

    document.getElementById("eq-low").addEventListener("input", (e) => { if(lowFilter) lowFilter.gain.value = parseFloat(e.target.value); });
    document.getElementById("eq-mid").addEventListener("input", (e) => { if(midFilter) midFilter.gain.value = parseFloat(e.target.value); });
    document.getElementById("eq-high").addEventListener("input", (e) => { if(highFilter) highFilter.gain.value = parseFloat(e.target.value); });

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!viewLibrary.clientWidth) return;

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const width = canvas.width, height = canvas.height;

      canvasCtx.clearRect(0, 0, width, height);

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (width / bufferLength) * 1.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * height * 0.85;
        const gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
        gradient.addColorStop(0, "#00f3ff");
        gradient.addColorStop(0.7, "#ff0055");
        gradient.addColorStop(1, "#ffffff");

        canvasCtx.fillStyle = gradient;
        canvasCtx.fillRect(x, height - barHeight, barWidth - 3, barHeight);
        x += barWidth;
      }
    }
  </script>
</body>
</html>
