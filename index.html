<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Audio Player Pro</title>
  
  <!-- Fuente Cyberpunk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- SDK Cliente Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lector de Metadatos ID3 / Tags -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Orbitron', monospace, sans-serif; 
    }

    body {
      background-color: #050508;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: #00f3ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px;
    }

    .player-card {
      background: rgba(10, 10, 18, 0.85); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.3); 
      border-radius: 16px; 
      padding: 24px 20px;
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
    }

    .glitch-wrapper { 
      text-align: center; 
      margin-bottom: 16px; 
    }

    .glitch { 
      font-size: 1.3rem; 
      font-weight: 900; 
      letter-spacing: 2px; 
      color: #00f3ff; 
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8); 
    }

    /* Autenticación */
    .auth-section {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 0, 85, 0.4);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
    }

    .auth-section h3 {
      font-size: 0.75rem;
      color: #ff0055;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .neon-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 0.75rem;
      margin-bottom: 8px;
      outline: none;
    }

    .neon-input:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .auth-buttons { display: flex; gap: 8px; }

    .neon-btn {
      flex: 1;
      background: rgba(0, 243, 255, 0.1);
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .neon-btn-secondary {
      flex: 1;
      background: rgba(255, 0, 85, 0.1);
      color: #ff0055;
      border: 1px solid #ff0055;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .neon-btn-danger {
      width: 100%;
      background: rgba(255, 0, 85, 0.2);
      color: #ff0055;
      border: 1px solid #ff0055;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    #auth-status { font-size: 0.65rem; margin-top: 6px; color: #ff0055; word-break: break-word; }
    .user-info { font-size: 0.7rem; color: #00f3ff; text-align: center; }

    /* Canvas del Visualizador */
    .visualizer-wrapper {
      width: 100%;
      height: 120px;
      margin: 0 auto 16px auto;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(5, 5, 12, 0.9);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Subida de Archivos */
    .file-upload-wrapper { margin-bottom: 16px; text-align: center; }
    #file-input { display: none; }

    .custom-file-btn { 
      display: block; 
      color: #ff0055; 
      border: 1px solid #ff0055; 
      padding: 10px; 
      border-radius: 8px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); 
    }

    #upload-status { font-size: 0.65rem; color: #00f3ff; margin-top: 6px; }

    /* Track Info */
    .track-info { text-align: center; margin-bottom: 16px; }
    .track-info h2 { font-size: 0.95rem; color: #ffffff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info p { color: rgba(0, 243, 255, 0.7); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 0.7rem; color: #00f3ff; }
    .progress-container input[type="range"] { flex: 1; -webkit-appearance: none; background: #12121c; height: 6px; border-radius: 3px; border: 1px solid rgba(0, 243, 255, 0.3); outline: none; }
    .progress-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff0055; box-shadow: 0 0 10px #ff0055; }

    .controls { display: flex; gap: 8px; margin-bottom: 20px; }
    .controls button { flex: 1; background: rgba(0, 243, 255, 0.05); color: #00f3ff; border: 1px solid #00f3ff; padding: 10px 0; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }

    /* Playlist */
    .playlist-container h3 { font-size: 0.75rem; color: #ff0055; margin-bottom: 8px; border-bottom: 1px solid rgba(255, 0, 85, 0.3); padding-bottom: 4px; }
    .playlist-container ul { list-style: none; max-height: 140px; overflow-y: auto; }
    
    .playlist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      font-size: 0.7rem;
      color: #a0a0b0;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist-item .track-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }

    .playlist-item.active {
      color: #00f3ff;
      border: 1px solid #00f3ff;
      background: rgba(0, 243, 255, 0.1);
    }

    .delete-btn {
      color: #ff0055;
      background: transparent;
      border: none;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0.7;
    }

    .delete-btn:hover {
      opacity: 1.0;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="glitch-wrapper">
      <h1 class="glitch">NEON//STUDIO</h1>
    </div>

    <!-- MÓDULO DE AUTENTICACIÓN -->
    <div class="auth-section">
      <div id="auth-form">
        <h3>SYSTEM//ACCESS</h3>
        <input type="email" id="auth-email" placeholder="CORREO@CYBER.COM" class="neon-input">
        <input type="password" id="auth-password" placeholder="CONTRASEÑA" class="neon-input">
        <div class="auth-buttons">
          <button id="btn-login" class="neon-btn">LOGIN</button>
          <button id="btn-signup" class="neon-btn-secondary">REGISTRAR</button>
        </div>
        <p id="auth-status"></p>
      </div>

      <div id="user-info" style="display: none;" class="user-info">
        <p id="user-email">USER: UNKNOWN</p>
        <button id="btn-logout" class="neon-btn-danger">LOGOUT</button>
      </div>
    </div>

    <!-- VISUALIZADOR DE AUDIO NEÓN -->
    <div class="visualizer-wrapper">
      <canvas id="visualizer"></canvas>
    </div>

    <!-- SUBIDA DE ARCHIVOS -->
    <div class="file-upload-wrapper">
      <label for="file-input" class="custom-file-btn">⚡ SUBIR AUDIO A LA NUBE (.WAV / .FLAC)</label>
      <input type="file" id="file-input" accept="audio/*,.wav,.flac,.mp3" multiple>
      <p id="upload-status"></p>
    </div>

    <div class="track-info">
      <h2 id="track-title">SELECCIONA PISTA</h2>
      <p id="track-artist">SYSTEM//READY</p>
    </div>

    <div class="progress-container">
      <span id="current-time">0:00</span>
      <input type="range" id="progress-bar" value="0" min="0" step="0.1">
      <span id="total-duration">0:00</span>
    </div>

    <div class="controls">
      <button id="btn-prev">⏮</button>
      <button id="btn-play">▶ PLAY</button>
      <button id="btn-next">⏭</button>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <div class="playlist-container">
      <h3>PLAYLIST//CYBER CLOUD</h3>
      <ul id="playlist"></ul>
    </div>
  </div>

  <script>
    // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = "https://cwpjjzamawyywfcsnaqo.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl"; 
    
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error("Error Supabase:", err);
    }

    let currentUser = null;

    // Elementos DOM
    const authForm = document.getElementById("auth-form");
    const userInfo = document.getElementById("user-info");
    const userEmail = document.getElementById("user-email");
    const authStatus = document.getElementById("auth-status");
    const uploadStatus = document.getElementById("upload-status");

    // AUTH LOGIN/SIGNUP/LOGOUT
    document.getElementById("btn-signup").addEventListener("click", async () => {
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value.trim();
      if (!email || !password) return authStatus.innerText = "INGRESA CORREO Y CONTRASEÑA";
      authStatus.innerText = "PROCESANDO...";
      const { error } = await supabaseClient.auth.signUp({ email, password });
      authStatus.innerText = error ? `ERR: ${error.message}` : "REGISTRO OK! REVISA TU EMAIL.";
    });

    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value.trim();
      if (!email || !password) return authStatus.innerText = "INGRESA CORREO Y CONTRASEÑA";
      authStatus.innerText = "VERIFICANDO...";
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) authStatus.innerText = `ERR: ${error.message}`;
    });

    document.getElementById("btn-logout").addEventListener("click", async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      songs.length = 0;
      renderPlaylist();
    });

    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentUser = session.user;
          authForm.style.display = "none";
          userInfo.style.display = "block";
          userEmail.innerText = `ONLINE: ${currentUser.email}`;
          loadCloudTracks(); 
        } else {
          currentUser = null;
          authForm.style.display = "block";
          userInfo.style.display = "none";
        }
      });
    }

    // --- SUBIDA CON JSMEDIATAGS ---
    document.getElementById("file-input").addEventListener("change", async (e) => {
      if (!currentUser || !supabaseClient) {
        uploadStatus.innerText = "ERR: DEBES INICIAR SESIÓN PRIMERO";
        return;
      }

      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      for (const file of files) {
        uploadStatus.innerText = `LEYENDO TAGS & SUBIENDO: ${file.name}...`;

        let originalTitle = file.name.replace(/\.[^/.]+$/, "").replace(/^\d+[\s.\-_]+/, "");
        let detectedArtist = "ARTISTA DESCONOCIDO";

        try {
          await new Promise((resolve) => {
            window.jsmediatags.read(file, {
              onSuccess: function(tag) {
                const tags = tag.tags;
                if (tags.title && tags.title.trim() !== "") originalTitle = tags.title.trim();
                if (tags.artist && tags.artist.trim() !== "") detectedArtist = tags.artist.trim();
                resolve();
              },
              onError: function() { resolve(); }
            });
          });
        } catch (err) {
          console.log("Excepción jsmediatags:", err);
        }

        const sanitizedFileName = file.name
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-zA-Z0-9.\-_]/g, "_");

        const filePath = `${currentUser.id}/${Date.now()}_${sanitizedFileName}`;

        try {
          const { error } = await supabaseClient.storage.from("audio-tracks").upload(filePath, file);
          if (error) {
            uploadStatus.innerText = `ERR AL SUBIR: ${error.message}`;
            return;
          }

          const { data: publicUrlData } = supabaseClient.storage.from("audio-tracks").getPublicUrl(filePath);

          uploadStatus.innerText = "¡SUBIDA COMPLETADA!";
          
          songs.push({
            fileNameOnServer: filePath,
            title: originalTitle,
            artist: detectedArtist,
            src: publicUrlData.publicUrl
          });
        } catch (err) {
          uploadStatus.innerText = `ERR EXCEPCIÓN SUBIDA: ${err.message}`;
        }
      }

      renderPlaylist();
      if (songs.length > 0) {
        currentSongIndex = songs.length - 1;
        loadSong(songs[currentSongIndex]);
        playSong();
      }
    });

    // CARGAR PISTAS DE LA NUBE
    async function loadCloudTracks() {
      if (!currentUser || !supabaseClient) return;
      uploadStatus.innerText = "CARGANDO BIBLIOTECA NUBE...";

      try {
        const { data, error } = await supabaseClient.storage.from("audio-tracks").list(currentUser.id, { limit: 100 });
        if (error || !data) { uploadStatus.innerText = ""; return; }

        songs.length = 0; 
        
        data.forEach(file => {
          const filePath = `${currentUser.id}/${file.name}`;
          const { data: publicUrlData } = supabaseClient.storage.from("audio-tracks").getPublicUrl(filePath);

          let cleanName = file.name.replace(/^\d+_/, "").replace(/\.[^/.]+$/, "").replace(/_/g, " ");

          songs.push({
            fileNameOnServer: filePath,
            title: cleanName,
            artist: "CLOUD//TRACK",
            src: publicUrlData.publicUrl
          });
        });

        renderPlaylist();
        if (songs.length > 0) loadSong(songs[0]);
        uploadStatus.innerText = `BIBLIOTECA: ${songs.length} PISTAS`;
      } catch (err) {
        uploadStatus.innerText = "";
      }
    }

    // BORRAR PISTA DE LA NUBE
    async function deleteTrack(index, e) {
      e.stopPropagation();
      const song = songs[index];
      if (!song) return;

      if (confirm(`¿Eliminar "${song.title}" de la nube?`)) {
        uploadStatus.innerText = "ELIMINANDO...";
        try {
          const { error } = await supabaseClient.storage.from("audio-tracks").remove([song.fileNameOnServer]);
          if (error) {
            uploadStatus.innerText = `ERR AL BORRAR: ${error.message}`;
            return;
          }
          songs.splice(index, 1);
          renderPlaylist();
          if (songs.length > 0) {
            currentSongIndex = Math.min(index, songs.length - 1);
            loadSong(songs[currentSongIndex]);
          } else {
            resetPlayerUI();
          }
          uploadStatus.innerText = "PISTA ELIMINADA";
        } catch (err) {
          uploadStatus.innerText = `ERR EXCEPCIÓN: ${err.message}`;
        }
      }
    }

    // --- LÓGICA DEL REPRODUCTOR & WEB AUDIO API ---
    const songs = []; 
    let currentSongIndex = 0; 
    let isPlaying = false;

    const audio = document.getElementById("audio-player");
    const title = document.getElementById("track-title");
    const artist = document.getElementById("track-artist");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalDurationEl = document.getElementById("total-duration");
    const playlistEl = document.getElementById("playlist");

    // VISUALIZADOR SETUP
    const canvas = document.getElementById("visualizer");
    const canvasCtx = canvas.getContext("2d");
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let visualizerInitialized = false;

    function initAudioContext() {
      if (visualizerInitialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64; // Número de barras de espectro

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        visualizerInitialized = true;
        drawVisualizer();
      } catch (e) {
        console.log("Web Audio API Error:", e);
      }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);

      // Ajustar resolución del canvas
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const width = canvas.width;
      const height = canvas.height;

      canvasCtx.clearRect(0, 0, width, height);

      if (!analyser) {
        // Línea base estática en espera
        canvasCtx.strokeStyle = "rgba(0, 243, 255, 0.3)";
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, height / 2);
        canvasCtx.lineTo(width, height / 2);
        canvasCtx.stroke();
        return;
      }

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      const barWidth = (width / bufferLength) * 1.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * height * 0.85;

        // Degradado neón (Cian a Magenta)
        const gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
        gradient.addColorStop(0, "#00f3ff");
        gradient.addColorStop(0.7, "#ff0055");
        gradient.addColorStop(1, "#ffffff");

        canvasCtx.fillStyle = gradient;
        canvasCtx.shadowBlur = 10;
        canvasCtx.shadowColor = "#00f3ff";

        canvasCtx.fillRect(x, height - barHeight, barWidth - 3, barHeight);

        x += barWidth;
      }
    }

    function resetPlayerUI() {
      title.innerText = "SELECCIONA PISTA";
      artist.innerText = "SYSTEM//READY";
      audio.src = "";
    }

    function loadSong(song) { 
      if (!song) return; 
      title.innerText = song.title; 
      artist.innerText = song.artist;
      audio.src = song.src; 
      audio.load();
      updatePlaylistHighlight(); 
    }

    function playSong() { 
      if (songs.length === 0) return; 
      initAudioContext();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => { isPlaying = true; btnPlay.innerText = "⏸ PAUSE"; })
          .catch(() => { isPlaying = false; btnPlay.innerText = "▶ PLAY"; });
      }
    }

    function pauseSong() { 
      isPlaying = false; 
      btnPlay.innerText = "▶ PLAY"; 
      audio.pause(); 
    }

    btnPlay.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      isPlaying ? pauseSong() : playSong(); 
    });

    btnPrev.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; 
      loadSong(songs[currentSongIndex]); 
      playSong(); 
    });

    btnNext.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      currentSongIndex = (currentSongIndex + 1) % songs.length; 
      loadSong(songs[currentSongIndex]); 
      playSong(); 
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.innerText = formatTime(audio.currentTime);
        totalDurationEl.innerText = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => { 
      if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration; 
    });

    audio.addEventListener("ended", () => btnNext.click());

    function formatTime(s) { 
      const min = Math.floor(s / 60); 
      const sec = Math.floor(s % 60); 
      return `${min}:${sec < 10 ? '0' : ''}${sec}`; 
    }

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      songs.forEach((song, i) => {
        const li = document.createElement("li"); 
        li.className = `playlist-item ${i === currentSongIndex ? 'active' : ''}`;
        
        const nameSpan = document.createElement("span");
        nameSpan.className = "track-name";
        nameSpan.innerText = `> ${song.title}`;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.innerText = "✕";
        delBtn.addEventListener("click", (e) => deleteTrack(i, e));

        li.appendChild(nameSpan);
        li.appendChild(delBtn);

        li.addEventListener("click", () => { 
          currentSongIndex = i; 
          loadSong(songs[currentSongIndex]); 
          playSong(); 
        });

        playlistEl.appendChild(li);
      });
    }

    function updatePlaylistHighlight() {
      playlistEl.querySelectorAll(".playlist-item").forEach((item, i) => { 
        if (i === currentSongIndex) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });
    }

    // Inicializar render de canvas en espera
    drawVisualizer();
  </script>
</body>
</html>
