<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Audio Player</title>

  <!-- Librería jsmediatags -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #030305;
      color: #00f3ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      transition: background 0.5s ease-in-out;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.6;
    }

    #tv-static-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      opacity: 0.15;
      pointer-events: none;
    }

    /* FONDO EN REPRODUCCIÓN */
    body.logged-in:has(#main-player.playing) {
      background-color: #121829;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.35) 0%, transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.35) 0%, transparent 55%),
        linear-gradient(180deg, rgba(20, 30, 55, 0.6) 0%, rgba(10, 15, 30, 0.8) 100%);
    }

    body.logged-in:has(#main-player.playing)::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .app-container {
      width: 90%;
      max-width: 480px;
      z-index: 5;
      margin: 20px auto;
    }

    .glitch-effect {
      animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }

    .navbar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 25, 0.85);
      border: 1px solid #00f3ff;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .menu-btn {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 35px;
      background: rgba(5, 5, 10, 0.95);
      border: 1px solid #ff0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
      min-width: 160px;
      z-index: 100;
      border-radius: 4px;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 10px;
      color: #fff;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.75rem;
    }

    .dropdown-item:hover { background: rgba(0, 243, 255, 0.2); }

    .submenu { display: none; padding-left: 15px; background: rgba(0,0,0,0.5); }
    .submenu.show { display: block; }

    .auth-box {
      background: rgba(10, 10, 20, 0.9);
      border: 2px solid #ff0055;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
      text-align: center;
    }

    .cyber-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #000;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      outline: none;
      border-radius: 4px;
    }

    .neon-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
    }

    .main-player-container {
      background: rgba(10, 15, 25, 0.9);
      border: 1px solid #00f3ff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      margin-bottom: 15px;
      position: relative;
    }

    .visualizer-wrapper {
      width: 100%;
      height: 70px;
      background: #000;
      border: 1px solid rgba(0, 243, 255, 0.3);
      margin-bottom: 10px;
      position: relative;
    }

    #visualizer { width: 100%; height: 100%; }

    /* MEDIDOR VU */
    .vu-meter-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 5px 0;
      font-size: 0.6rem;
    }
    .vu-track {
      flex: 1;
      height: 6px;
      background: #111;
      border: 1px solid #333;
      border-radius: 3px;
      overflow: hidden;
    }
    .vu-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ff00 60%, #ffff00 85%, #ff0000 100%);
      transition: width 0.05s ease;
    }

    /* LYRICS */
    .lyrics-display {
      min-height: 28px;
      font-size: 0.75rem;
      color: #ff0055;
      text-shadow: 0 0 5px rgba(255,0,85,0.8);
      text-align: center;
      margin: 6px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-display { text-align: center; margin-bottom: 10px; }
    .player-title { font-weight: bold; color: #ff0055; font-size: 0.9rem; text-transform: uppercase; }
    .player-artist { font-size: 0.75rem; color: #00f3ff; }

    .player-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .player-btn {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    .player-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
    }

    .player-progress input[type="range"] {
      flex: 1;
      accent-color: #ff0055;
    }

    .skin-sony { background: #111; border: 2px solid #555; }
    .skin-sony .sony-brand { font-weight: bold; color: #888; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 5px; }

    .skin-walkman { background: #2b2b2b; border: 3px solid #ff9900; }
    .skin-walkman .walkman-logo { color: #ff9900; font-weight: bold; font-size: 0.8rem; }
    .cassette-window {
      background: #000; height: 40px; border: 1px solid #ff9900;
      display: flex; align-items: center; justify-content: space-around; margin: 8px 0;
    }
    .cassette-reel {
      width: 20px; height: 20px; border-radius: 50%; border: 2px dashed #ff9900;
      animation: spin 3s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .track-list { list-style: none; margin-top: 10px; max-height: 180px; overflow-y: auto; }
    .track-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px; border-bottom: 1px dashed rgba(0, 243, 255, 0.2); font-size: 0.75rem;
    }
    .track-meta { cursor: pointer; flex: 1; }
    .track-actions { display: flex; gap: 5px; }
    .action-btn { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; font-size: 0.6rem; cursor: pointer; padding: 2px 4px; }
    .action-btn.danger { border-color: #ff0055; color: #ff0055; }

    .eq-container {
      display: flex; justify-content: space-between; background: rgba(0,0,0,0.5);
      padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.65rem;
    }
    .eq-band { display: flex; flex-direction: column; align-items: center; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;
    }
    .modal-content { background: #05050a; border: 1px solid #00f3ff; padding: 20px; border-radius: 8px; width: 80%; max-width: 320px; }
  </style>
</head>
<body>

  <canvas id="tv-static-canvas"></canvas>
  <audio id="audio-player" crossorigin="anonymous"></audio>
  <input type="file" id="lrc-file-input" accept=".lrc" style="display:none;">

  <div class="app-container">
    <div class="navbar" id="app-navbar">
      <span style="font-weight: bold; font-size: 0.8rem;">CYBER//AUDIO</span>
      <div class="dropdown">
        <button class="menu-btn" id="btn-toggle-menu">MENÚ ☰</button>
        <div class="dropdown-menu" id="dropdown-menu">
          <div class="dropdown-item" id="menu-library">🎵 MI LIBRERÍA</div>
          <div class="dropdown-item" id="menu-playlists">📂 PLAYLISTS</div>
          <div class="dropdown-item" id="menu-skins-toggle">🎨 SKINS ▶</div>
          <div class="submenu" id="skins-submenu">
            <div class="dropdown-item skin-option" data-skin="classic">► CLASSIC</div>
            <div class="dropdown-item skin-option" data-skin="sony">► SONY SYSTEM</div>
            <div class="dropdown-item skin-option" data-skin="walkman">► WALKMAN</div>
          </div>
          <div class="dropdown-item" id="menu-logout" style="color:#ff0055;">🚪 CERRAR SESIÓN</div>
        </div>
      </div>
    </div>

    <div class="auth-box" id="auth-screen">
      <h2 style="color:#ff0055; margin-bottom: 10px; font-size: 1.1rem;">CYBERPUNK AUDIO SYSTEM</h2>
      <p style="font-size: 0.7rem; margin-bottom: 15px; color: #00f3ff;">ACCESO REQUERIDO</p>
      <input type="email" id="auth-email" class="cyber-input" placeholder="EMAIL">
      <input type="password" id="auth-password" class="cyber-input" placeholder="CONTRASEÑA">
      <div style="margin-top: 10px;">
        <button class="neon-btn" id="btn-login">LOGIN</button>
        <button class="neon-btn" id="btn-signup" style="background:transparent; border:1px solid #ff0055;">REGISTRO</button>
      </div>
      <div id="auth-status" style="margin-top: 10px; font-size: 0.65rem; color:#ff0055;"></div>
    </div>

    <div class="main-player-container skin-classic" id="main-player" style="display:none;"></div>

    <div id="view-library" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <span style="font-size:0.75rem; font-weight:bold;">SUBIR ARCHIVOS:</span>
        <input type="file" id="file-input" multiple accept="audio/*" style="display:none;">
        <button class="neon-btn" onclick="document.getElementById('file-input').click()" style="font-size:0.65rem; padding:4px 8px;">+ ARCHIVOS</button>
      </div>
      <div id="upload-status" style="font-size:0.6rem; color:#00f3ff; margin-bottom:8px;"></div>
      <ul class="track-list" id="library-track-list"></ul>

      <div class="eq-container">
        <div class="eq-band">
          <span>LOW</span>
          <input type="range" id="eq-low" min="-12" max="12" value="0" step="1">
        </div>
        <div class="eq-band">
          <span>MID</span>
          <input type="range" id="eq-mid" min="-12" max="12" value="0" step="1">
        </div>
        <div class="eq-band">
          <span>HIGH</span>
          <input type="range" id="eq-high" min="-12" max="12" value="0" step="1">
        </div>
      </div>
    </div>

    <div id="view-playlists" style="display:none;">
      <button class="neon-btn" id="btn-create-playlist" style="width:100%; margin-bottom:10px; font-size:0.7rem;">+ NUEVA PLAYLIST</button>
      <div id="playlists-container"></div>
    </div>
  </div>

  <div class="modal" id="modal-add-playlist">
    <div class="modal-content">
      <p style="font-size:0.75rem; margin-bottom:10px;">SELECCIONA PLAYLIST:</p>
      <div id="modal-playlist-options"></div>
      <button class="neon-btn" id="btn-close-modal" style="width:100%; margin-top:10px; background:#333;">CANCELAR</button>
    </div>
  </div>

  <script>
    // EFECTO DE ESTÁTICA TV (FONDO)
    const staticCanvas = document.getElementById("tv-static-canvas");
    const staticCtx = staticCanvas.getContext("2d");
    let staticAnimationId = null;

    function resizeStaticCanvas() {
      staticCanvas.width = window.innerWidth / 2;
      staticCanvas.height = window.innerHeight / 2;
    }
    window.addEventListener("resize", resizeStaticCanvas);
    resizeStaticCanvas();

    function generateTVStatic() {
      const width = staticCanvas.width;
      const height = staticCanvas.height;
      const imgData = staticCtx.createImageData(width, height);
      const buffer = new Uint32Array(imgData.data.buffer);
      const len = buffer.length;

      for (let i = 0; i < len; i++) {
        const color = Math.random() * 255 | 0;
        buffer[i] = (255 << 24) | (color << 16) | (color << 8) | color;
      }

      staticCtx.putImageData(imgData, 0, 0);
      staticAnimationId = requestAnimationFrame(generateTVStatic);
    }

    function startTVStatic() {
      if (!staticAnimationId) {
        staticCanvas.style.display = "block";
        generateTVStatic();
      }
    }

    function stopTVStatic() {
      if (staticAnimationId) {
        cancelAnimationFrame(staticAnimationId);
        staticAnimationId = null;
        staticCanvas.style.display = "none";
      }
    }

    startTVStatic();

    // CREDENCIALES SUPABASE (REEMPLAZA ESTOS VALORES POR LOS TUYOS)
    const SUPABASE_URL = "https://cwpjjzamawyywfcsnaqo.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl"; 
    
    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) { console.error("Error Supabase:", err); }

    let currentUser = null;
    let songs = [];
    let playlists = [];
    let currentQueue = [];
    let currentSongIndex = -1;
    let isPlaying = false;
    
    let currentSkin = localStorage.getItem("musicapp_skin") || "classic";
    let visualizerMode = "bars"; 
    let lyricsData = [];

    const appNavbar = document.getElementById("app-navbar");
    const authScreen = document.getElementById("auth-screen");
    const viewLibrary = document.getElementById("view-library");
    const viewPlaylists = document.getElementById("view-playlists");
    const mainPlayer = document.getElementById("main-player");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const skinsSubmenu = document.getElementById("skins-submenu");
    const audio = document.getElementById("audio-player");

    function triggerGlitch(element, cb) {
      element.classList.remove("glitch-effect");
      void element.offsetWidth;
      element.classList.add("glitch-effect");
      setTimeout(() => { 
        element.classList.remove("glitch-effect"); 
        if(cb) cb(); 
      }, 400);
    }

    function showView(view) {
      viewLibrary.style.display = "none";
      viewPlaylists.style.display = "none";

      if (view === "library") {
        viewLibrary.style.display = "block";
        triggerGlitch(viewLibrary);
      } else if (view === "playlists") {
        viewPlaylists.style.display = "block";
        triggerGlitch(viewPlaylists);
      }
    }

    document.getElementById("btn-toggle-menu").addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("show");
    });

    document.getElementById("menu-skins-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      skinsSubmenu.classList.toggle("show");
    });

    document.addEventListener("click", () => {
      dropdownMenu.classList.remove("show");
      skinsSubmenu.classList.remove("show");
    });

    document.querySelectorAll(".skin-option").forEach(opt => {
      opt.addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelectorAll(".skin-option").forEach(o => o.classList.remove("active"));
        opt.classList.add("active");
        currentSkin = opt.getAttribute("data-skin");
        localStorage.setItem("musicapp_skin", currentSkin);
        applySkin(currentSkin);
      });
    });

    document.getElementById("menu-library").addEventListener("click", () => showView("library"));
    document.getElementById("menu-playlists").addEventListener("click", () => showView("playlists"));

    document.getElementById("btn-login").addEventListener("click", async () => {
      triggerGlitch(authScreen, async () => {
        const email = document.getElementById("auth-email").value.trim();
        const password = document.getElementById("auth-password").value.trim();
        if (!email || !password) {
          document.getElementById("auth-status").innerText = "INGRESA EMAIL Y CONTRASEÑA";
          return;
        }
        if (supabaseClient) {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) document.getElementById("auth-status").innerText = error.message;
        }
      });
    });

    document.getElementById("btn-signup").addEventListener("click", async () => {
      triggerGlitch(authScreen, async () => {
        const email = document.getElementById("auth-email").value.trim();
        const password = document.getElementById("auth-password").value.trim();
        if (!email || !password) return;
        if (supabaseClient) {
          const { error } = await supabaseClient.auth.signUp({ email, password });
          document.getElementById("auth-status").innerText = error ? error.message : "¡REGISTRO OK! REVISA TU EMAIL.";
        }
      });
    });

    document.getElementById("menu-logout").addEventListener("click", async () => {
      if (supabaseClient) await supabaseClient.auth.signOut();
      stopSong();
    });

    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          currentUser = session.user;
          document.body.classList.add("logged-in");
          stopTVStatic();
          
          authScreen.style.display = "none";
          appNavbar.style.display = "flex";
          mainPlayer.style.display = "block";
          
          document.querySelectorAll(".skin-option").forEach(o => {
            o.classList.toggle("active", o.getAttribute("data-skin") === currentSkin);
          });

          applySkin(currentSkin);
          showView("library");
          loadCloudTracks();
        } else {
          currentUser = null;
          document.body.classList.remove("logged-in");
          startTVStatic();

          authScreen.style.display = "block";
          appNavbar.style.display = "none";
          mainPlayer.style.display = "none";
          viewLibrary.style.display = "none";
          viewPlaylists.style.display = "none";
        }
      });
    }

    // CARGAR ARCHIVOS DESDE SUPABASE
    async function loadCloudTracks() {
      if (!currentUser || !supabaseClient) return;
      
      const { data, error } = await supabaseClient.storage.from("audio-tracks").list(currentUser.id, { limit: 100 });
      if (error || !data) return;

      songs = data.map(file => {
        const filePath = `${currentUser.id}/${file.name}`;
        const { data: publicUrlData } = supabaseClient.storage.from("audio-tracks").getPublicUrl(filePath);
        return {
          id: file.id || filePath,
          fileNameOnServer: filePath,
          title: file.name.replace(/^\d+_/, "").replace(/\.[^/.]+$/, "").replace(/_/g, " "),
          artist: "DESCONOCIDO",
          album: "CYBER AUDIO",
          artwork: null,
          src: publicUrlData.publicUrl
        };
      });

      renderLibrary();
    }

    // RENDERIZADO DE BIBLIOTECA CON REPRODUCIR, DESCARGAR Y ELIMINAR
    function renderLibrary() {
      const list = document.getElementById("library-track-list");
      if (!list) return;
      list.innerHTML = "";

      songs.forEach((song, i) => {
        const li = document.createElement("li");
        li.className = "track-item";
        li.innerHTML = `
          <div class="track-meta">
            <div class="track-name" style="font-weight:bold;">${song.title}</div>
            <div class="track-artist-sub" style="font-size:0.6rem; color:#888;">${song.artist} • ${song.album}</div>
          </div>
          <div class="track-actions">
            <button class="action-btn" onclick="downloadTrack(${i}, event)">⬇ DL</button>
            <button class="action-btn danger" onclick="deleteTrack(${i}, event)">✕</button>
          </div>
        `;
        li.querySelector(".track-meta").addEventListener("click", () => playQueue(songs, i));
        list.appendChild(li);
      });
    }

    // PROCESO DE SUBIDA
    async function processAndUploadFiles(files) {
      const statusEl = document.getElementById("upload-status");
      if (!files.length || !currentUser) return;

      for (const file of files) {
        statusEl.innerText = `PROCESANDO: ${file.name}...`;

        if (window.jsmediatags) {
          window.jsmediatags.read(file, {
            onSuccess: async function(tag) {
              const tags = tag.tags;
              const title = tags.title || file.name.replace(/\.[^/.]+$/, "");
              const artist = tags.artist || "ARTISTA DESCONOCIDO";
              const album = tags.album || "ÁLBUM DESCONOCIDO";

              await uploadFileToSupabase(file, title, artist, album);
            },
            onError: async function() {
              await uploadFileToSupabase(file, file.name.replace(/\.[^/.]+$/, ""), "ARTISTA DESCONOCIDO", "CYBER AUDIO");
            }
          });
        } else {
          await uploadFileToSupabase(file, file.name.replace(/\.[^/.]+$/, ""), "ARTISTA DESCONOCIDO", "CYBER AUDIO");
        }
      }
    }

    async function uploadFileToSupabase(file, title, artist, album) {
      const statusEl = document.getElementById("upload-status");
      statusEl.innerText = `SUBIENDO: ${title}...`;

      const cleanFileName = file.name.toLowerCase().replace(/[^a-z0-9.]/g, "_");
      const filePath = `${currentUser.id}/${Date.now()}_${cleanFileName}`;

      try {
        const { data, error } = await supabaseClient.storage
          .from("audio-tracks")
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: true,
            contentType: file.type || 'audio/mpeg'
          });

        if (error) {
          statusEl.innerText = `ERROR AL SUBIR: ${error.message}`;
        } else {
          statusEl.innerText = "¡SUBIDA COMPLETADA!";
          await loadCloudTracks();
        }
      } catch (err) {
        statusEl.innerText = "ERROR DE CONEXIÓN O ALMACENAMIENTO";
      }
    }

    // DESCARGAR PISTA
    async function downloadTrack(index, e) {
      e.stopPropagation();
      const song = songs[index];
      const statusEl = document.getElementById("upload-status");
      
      if (statusEl) statusEl.innerText = `DESCARGANDO: ${song.title}...`;

      try {
        const response = await fetch(song.src);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = `${song.title}.mp3`;
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        if (statusEl) statusEl.innerText = "DESCARGA COMPLETADA";
      } catch (err) {
        if (statusEl) statusEl.innerText = "ERROR EN LA DESCARGA";
      }
    }

    // ELIMINAR PISTA
    async function deleteTrack(index, e) {
      e.stopPropagation();
      const song = songs[index];
      
      if (confirm(`¿Confirmas eliminar "${song.title}" de tu biblioteca?`)) {
        const statusEl = document.getElementById("upload-status");
        if (statusEl) statusEl.innerText = `ELIMINANDO: ${song.title}...`;

        const { error } = await supabaseClient.storage.from("audio-tracks").remove([song.fileNameOnServer]);
        
        if (error) {
          if (statusEl) statusEl.innerText = `ERROR AL BORRAR: ${error.message}`;
        } else {
          if (statusEl) statusEl.innerText = "PISTA ELIMINADA";
          if (currentSongIndex === index) stopSong();
          await loadCloudTracks();
        }
      }
    }

    document.getElementById("file-input").addEventListener("change", (e) => {
      processAndUploadFiles(Array.from(e.target.files));
    });

    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        processAndUploadFiles(Array.from(e.dataTransfer.files));
      }
    });

    // ARCHIVOS LRC (LETRAS)
    document.getElementById("lrc-file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => parseLRC(evt.target.result);
      reader.readAsText(file);
    });

    function parseLRC(lrcText) {
      lyricsData = [];
      const lines = lrcText.split("\n");
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      lines.forEach(line => {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1]);
          const seconds = parseInt(match[2]);
          const millis = parseInt(match[3].padEnd(3, '0'));
          const time = minutes * 60 + seconds + millis / 1000;
          const text = line.replace(timeRegex, "").trim();
          if (text) lyricsData.push({ time, text });
        }
      });
      lyricsData.sort((a, b) => a.time - b.time);
    }

    // APLICAR SKINS
    function applySkin(skinName) {
      mainPlayer.className = `main-player-container skin-${skinName}${isPlaying ? ' playing' : ''}`;

      let baseLayout = `
        <div class="visualizer-wrapper">
          <canvas id="visualizer"></canvas>
        </div>
        <div class="vu-meter-bar">
          <span>VU</span>
          <div class="vu-track"><div class="vu-fill" id="vu-fill"></div></div>
          <button class="action-btn" id="btn-toggle-vis-mode" style="font-size:0.55rem;">MODO: BARRAS</button>
          <button class="action-btn" id="btn-load-lrc" style="font-size:0.55rem;">[LRC]</button>
        </div>
        <div class="lyrics-display" id="lyrics-display">-- CYBER LYRICS --</div>
      `;

      if (skinName === "classic") {
        mainPlayer.innerHTML = baseLayout + `
          <div class="info-display">
            <div class="player-title" id="player-track-title">SELECCIONA PISTA</div>
            <div class="player-artist" id="player-track-artist">SYSTEM//READY</div>
          </div>
          <div class="player-controls">
            <button class="player-btn" id="btn-player-prev">⏮</button>
            <button class="player-btn" id="btn-player-play">▶</button>
            <button class="player-btn" id="btn-player-next">⏭</button>
          </div>
          <div class="player-progress">
            <span id="player-current-time">0:00</span>
            <input type="range" id="player-progress-bar" value="0" min="0" step="0.1">
            <span id="player-total-duration">0:00</span>
          </div>
        `;
      } else if (skinName === "sony") {
        mainPlayer.innerHTML = `
          <div class="sony-brand">SONY CYBER-SYSTEM X1</div>
          <div class="sony-screen">
            <div class="player-title" id="player-track-title">SELECCIONA PISTA</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px; margin-bottom: 5px;">
              <div class="player-artist" id="player-track-artist">ARTISTA: N/A</div>
              <div class="player-album" id="player-track-album" style="font-size:0.65rem;">ÁLBUM: SYSTEM</div>
            </div>
            ${baseLayout}
          </div>
          <div class="player-controls">
            <button class="player-btn" id="btn-player-prev">⏮ REV</button>
            <button class="player-btn" id="btn-player-play">▶ PLAY</button>
            <button class="player-btn btn-stop" id="btn-player-stop">⏹ STOP</button>
            <button class="player-btn" id="btn-player-next">⏭ FWD</button>
          </div>
          <div class="player-progress">
            <span id="player-current-time">0:00</span>
            <input type="range" id="player-progress-bar" value="0" min="0" step="0.1">
            <span id="player-total-duration">0:00</span>
          </div>
        `;
      } else if (skinName === "walkman") {
        mainPlayer.innerHTML = `
          <div class="walkman-header" style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span class="walkman-logo">SONY WALKMAN</span>
            <span style="font-size:0.5rem; color:#00f3ff;">AVLS // AUTO REVERSE</span>
          </div>
          <div class="walkman-window">
            <div class="player-title" id="player-track-title">SELECCIONA PISTA</div>
            <div class="player-artist" id="player-track-artist">SYSTEM READY</div>
            <div class="cassette-window">
              <div class="cassette-reel"></div>
              <div style="width: 40px; height: 12px; background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; border-radius: 2px;"></div>
              <div class="cassette-reel"></div>
            </div>
            ${baseLayout}
          </div>
          <div class="player-controls">
            <button class="player-btn" id="btn-player-play">▶ PLAY</button>
            <button class="player-btn" id="btn-player-pause">⏸ PAUSE</button>
            <button class="player-btn btn-stop" id="btn-player-stop">⏹ EJECT</button>
            <button class="player-btn" id="btn-player-prev">◄◄ REW</button>
            <button class="player-btn" id="btn-player-next">►► FF</button>
          </div>
          <div class="player-progress">
            <span id="player-current-time">0:00</span>
            <input type="range" id="player-progress-bar" value="0" min="0" step="0.1">
            <span id="player-total-duration">0:00</span>
          </div>
        `;
      }

      bindPlayerControls();
      updatePlayerUI();
      
      canvas = document.getElementById("visualizer");
      if (canvas) canvasCtx = canvas.getContext("2d");
    }

    function bindPlayerControls() {
      const btnPlay = document.getElementById("btn-player-play");
      const btnPause = document.getElementById("btn-player-pause");
      const btnStop = document.getElementById("btn-player-stop");
      const btnNext = document.getElementById("btn-player-next");
      const btnPrev = document.getElementById("btn-player-prev");
      const progressBar = document.getElementById("player-progress-bar");
      const btnToggleVis = document.getElementById("btn-toggle-vis-mode");
      const btnLoadLrc = document.getElementById("btn-load-lrc");

      if (btnPlay) {
        btnPlay.onclick = () => {
          if (currentSongIndex === -1 && songs.length > 0) playQueue(songs, 0);
          else isPlaying ? pauseSong() : playSong();
        };
      }

      if (btnPause) btnPause.onclick = () => pauseSong();
      if (btnStop) btnStop.onclick = () => stopSong();
      if (btnNext) btnNext.onclick = () => playNext();
      if (btnPrev) btnPrev.onclick = () => playPrev();

      if (btnToggleVis) {
        btnToggleVis.onclick = () => {
          visualizerMode = (visualizerMode === "bars") ? "wave" : "bars";
          btnToggleVis.innerText = visualizerMode === "bars" ? "MODO: BARRAS" : "MODO: ONDA";
        };
      }

      if (btnLoadLrc) {
        btnLoadLrc.onclick = () => document.getElementById("lrc-file-input").click();
      }

      if (progressBar) {
        progressBar.oninput = () => {
          if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
        };
      }
    }

    function playNext() {
      if (currentQueue.length === 0) return;
      currentSongIndex = (currentSongIndex + 1) % currentQueue.length;
      loadSong(currentQueue[currentSongIndex]);
      playSong();
    }

    function playPrev() {
      if (currentQueue.length === 0) return;
      currentSongIndex = (currentSongIndex - 1 + currentQueue.length) % currentQueue.length;
      loadSong(currentQueue[currentSongIndex]);
      playSong();
    }

    function playQueue(queue, index) {
      currentQueue = queue;
      currentSongIndex = index;
      loadSong(currentQueue[currentSongIndex]);
      playSong();
    }

    function loadSong(song) {
      if (!song) return;
      audio.src = song.src;
      audio.load();
      lyricsData = [];

      if (window.jsmediatags && song.src) {
        window.jsmediatags.read(song.src, {
          onSuccess: function(tag) {
            const tags = tag.tags;
            if (tags.title) song.title = tags.title;
            if (tags.artist) song.artist = tags.artist;
            if (tags.album) song.album = tags.album;
            updatePlayerUI();
          },
          onError: function() {
            updatePlayerUI();
          }
        });
      } else {
        updatePlayerUI();
      }
    }

    function updatePlayerUI() {
      const song = currentQueue[currentSongIndex];
      const playerTitle = document.getElementById("player-track-title");
      const playerArtist = document.getElementById("player-track-artist");
      const playerAlbum = document.getElementById("player-track-album");
      const btnPlay = document.getElementById("btn-player-play");

      if (song) {
        if (playerTitle) playerTitle.innerText = song.title;
        if (playerArtist) playerArtist.innerText = (currentSkin === "sony" ? "ARTISTA: " : "") + song.artist;
        if (playerAlbum) playerAlbum.innerText = "ÁLBUM: " + (song.album || "CYBER ALBUM");
      }

      if (btnPlay) {
        btnPlay.innerText = isPlaying ? (currentSkin === "classic" ? "⏸" : "⏸ PAUSE") : (currentSkin === "classic" ? "▶" : "▶ PLAY");
      }

      if (isPlaying) {
        mainPlayer.classList.add("playing");
      } else {
        mainPlayer.classList.remove("playing");
      }
    }

    function playSong() {
      initAudioGraph();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      audio.play().then(() => {
        isPlaying = true;
        updatePlayerUI();
      }).catch(() => {
        isPlaying = false;
        updatePlayerUI();
      });
    }

    function pauseSong() {
      isPlaying = false;
      audio.pause();
      updatePlayerUI();
    }

    function stopSong() {
      isPlaying = false;
      audio.pause();
      audio.currentTime = 0;
      updatePlayerUI();
    }

    audio.addEventListener("timeupdate", () => {
      const progressBar = document.getElementById("player-progress-bar");
      const currentTimeEl = document.getElementById("player-current-time");
      const totalDurationEl = document.getElementById("player-total-duration");
      const lyricsDisplay = document.getElementById("lyrics-display");

      if (audio.duration) {
        if (progressBar) progressBar.value = (audio.currentTime / audio.duration) * 100;
        if (currentTimeEl) currentTimeEl.innerText = formatTime(audio.currentTime);
        if (totalDurationEl) totalDurationEl.innerText = formatTime(audio.duration);
      }

      if (lyricsData.length > 0 && lyricsDisplay) {
        const currentLyric = lyricsData.slice().reverse().find(l => audio.currentTime >= l.time);
        lyricsDisplay.innerText = currentLyric ? currentLyric.text : "...";
      }
    });

    audio.addEventListener("ended", () => playNext());

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // WEB AUDIO API Y VISUALIZADOR
    let canvas = null, canvasCtx = null;
    let audioCtx, analyser, sourceNode, lowFilter, midFilter, highFilter, audioGraphInitialized = false;

    function initAudioGraph() {
      if (audioGraphInitialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        const savedLow = localStorage.getItem("musicapp_eq_low") || "0";
        const savedMid = localStorage.getItem("musicapp_eq_mid") || "0";
        const savedHigh = localStorage.getItem("musicapp_eq_high") || "0";

        document.getElementById("eq-low").value = savedLow;
        document.getElementById("eq-mid").value = savedMid;
        document.getElementById("eq-high").value = savedHigh;

        lowFilter = audioCtx.createBiquadFilter();
        lowFilter.type = "lowshelf"; lowFilter.frequency.value = 60;
        lowFilter.gain.value = parseFloat(savedLow);

        midFilter = audioCtx.createBiquadFilter();
        midFilter.type = "peaking"; midFilter.frequency.value = 1000; midFilter.Q.value = 1.0;
        midFilter.gain.value = parseFloat(savedMid);

        highFilter = audioCtx.createBiquadFilter();
        highFilter.type = "highshelf"; highFilter.frequency.value = 10000;
        highFilter.gain.value = parseFloat(savedHigh);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(lowFilter);
        lowFilter.connect(midFilter);
        midFilter.connect(highFilter);
        highFilter.connect(analyser);
        analyser.connect(audioCtx.destination);

        audioGraphInitialized = true;
        drawVisualizer();
      } catch (e) { console.log(e); }
    }

    document.getElementById("eq-low").addEventListener("input", (e) => {
      if(lowFilter) lowFilter.gain.value = parseFloat(e.target.value);
      localStorage.setItem("musicapp_eq_low", e.target.value);
    });
    document.getElementById("eq-mid").addEventListener("input", (e) => {
      if(midFilter) midFilter.gain.value = parseFloat(e.target.value);
      localStorage.setItem("musicapp_eq_mid", e.target.value);
    });
    document.getElementById("eq-high").addEventListener("input", (e) => {
      if(highFilter) highFilter.gain.value = parseFloat(e.target.value);
      localStorage.setItem("musicapp_eq_high", e.target.value);
    });

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      canvas = document.getElementById("visualizer");
      if (!canvas || !viewLibrary.clientWidth) return;
      canvasCtx = canvas.getContext("2d");

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const width = canvas.width, height = canvas.height;

      canvasCtx.clearRect(0, 0, width, height);

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const freqData = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(freqData);

      let sum = 0;
      for (let i = 0; i < bufferLength; i++) { sum += freqData[i]; }
      const averagePeak = sum / bufferLength;
      const vuFill = document.getElementById("vu-fill");
      if (vuFill) vuFill.style.width = `${Math.min(100, (averagePeak / 180) * 100)}%`;

      if (visualizerMode === "bars") {
        const barWidth = (width / bufferLength) * 1.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (freqData[i] / 255) * height * 0.85;

          let gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
          gradient.addColorStop(0, "#00f3ff");
          gradient.addColorStop(0.7, "#ff0055");
          gradient.addColorStop(1, "#ffffff");

          canvasCtx.fillStyle = gradient;
          canvasCtx.fillRect(x, height - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      } else if (visualizerMode === "wave") {
        const timeData = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(timeData);

        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = "#00f3ff";
        canvasCtx.beginPath();

        const sliceWidth = width / analyser.fftSize;
        let x = 0;

        for (let i = 0; i < analyser.fftSize; i++) {
          const v = timeData[i] / 128.0;
          const y = (v * height) / 2;

          if (i === 0) canvasCtx.moveTo(x, y);
          else canvasCtx.lineTo(x, y);

          x += sliceWidth;
        }

        canvasCtx.lineTo(width, height / 2);
        canvasCtx.stroke();
      }
    }
  </script>
