<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicApp</title>

  <!-- Librería jsmediatags -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* VARIABLES Y PALETAS DE FONDOS OPERA GX */
    :root {
      --gx-bg: #0d0e12;
      --gx-surface: #14161d;
      --gx-surface-card: #1c1e26;
      --gx-accent: #ff0055;
      --gx-accent-glow: rgba(255, 0, 85, 0.4);
      --gx-text: #ffffff;
      --gx-text-muted: #8e94a0;
      --gx-border: #2a2e3d;
      --gx-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body.skin-purple {
      --gx-bg: #0f0914;
      --gx-surface: #181122;
      --gx-surface-card: #221830;
      --gx-accent: #9d4edd;
      --gx-accent-glow: rgba(157, 78, 221, 0.4);
      --gx-border: #36244d;
    }

    body.skin-ultraviolet {
      --gx-bg: #05131a;
      --gx-surface: #0a1f29;
      --gx-surface-card: #102a38;
      --gx-accent: #00f0ff;
      --gx-accent-glow: rgba(0, 240, 255, 0.4);
      --gx-border: #1a4257;
    }

    body.skin-frankenstein {
      --gx-bg: #07120a;
      --gx-surface: #0d1f12;
      --gx-surface-card: #142a1a;
      --gx-accent: #00ff66;
      --gx-accent-glow: rgba(0, 255, 102, 0.4);
      --gx-border: #1e4527;
    }
    
        body.skin-radioactive {
      --gx-bg: #040d06;                  /* Verde/negro profundo de fondo */
      --gx-surface: #0a170d;             /* Pantalla y tarjetas principales */
      --gx-surface-card: #112415;        /* Elementos e ítems secundarios */
      --gx-accent: #39ff14;              /* Verde tóxico/neón radioactivo */
      --gx-accent-glow: rgba(57, 255, 20, 0.45); /* Brillo neón */
      --gx-border: #1e4522;              /* Borde industrial */
    }


    body.skin-gold {
      --gx-bg: #14100b;
      --gx-surface: #1f1a13;
      --gx-surface-card: #2a231b;
      --gx-accent: #e0a96d;
      --gx-accent-glow: rgba(224, 169, 109, 0.4);
      --gx-border: #423628;
    }

    body.skin-sony {
      --gx-bg: #0a0a0c;
      --gx-surface: #121318;
      --gx-surface-card: #1a1b22;
      --gx-accent: #3b82f6;
      --gx-accent-glow: rgba(59, 130, 246, 0.4);
      --gx-border: #252836;
    }

    body.skin-walkman {
      --gx-bg: #120e08;
      --gx-surface: #1c1710;
      --gx-surface-card: #262018;
      --gx-accent: #ff9900;
      --gx-accent-glow: rgba(255, 153, 0, 0.4);
      --gx-border: #3d3122;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--gx-font);
    }

    /* CORRECCIÓN 1: Body fijo al 100% de la pantalla y sin scroll global */
    body {
      background-color: var(--gx-bg);
      color: var(--gx-text);
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Evita que la pantalla se mueva por completo */
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(var(--gx-border) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.3;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #tv-static-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      opacity: 0.12;
      pointer-events: none;
    }

    body.logged-in:has(#main-player.playing) {
      background-image: 
        radial-gradient(circle at 50% 30%, var(--gx-accent-glow) 0%, transparent 70%),
        linear-gradient(180deg, var(--gx-surface) 0%, var(--gx-bg) 100%);
    }

    body.logged-in:has(#main-player.playing)::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* CORRECCIÓN 2: Contenedor con altura controlada e inmóvil */
    .app-container {
      width: 90%;
      max-width: 480px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 20;
      margin: 0 auto;
      position: relative;
    }

    .glitch-effect {
      animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }

    .navbar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-left: 3px solid var(--gx-accent);
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
      flex-shrink: 0;
    }

    .menu-btn {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      border-color: var(--gx-accent);
      color: var(--gx-accent);
      box-shadow: 0 0 10px var(--gx-accent-glow);
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 35px;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      min-width: 170px;
      z-index: 100;
      border-radius: 4px;
      overflow: hidden;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 10px 14px;
      color: var(--gx-text-muted);
      cursor: pointer;
      border-bottom: 1px solid var(--gx-border);
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .dropdown-item:hover {
      background: var(--gx-surface-card);
      color: var(--gx-accent);
      padding-left: 18px;
    }

    .submenu { display: none; padding-left: 10px; background: rgba(0,0,0,0.3); }
    .submenu.show { display: block; }

    /* CORRECCIÓN 3: Cuadro de inicio de sesión inmóvil y centrado */
    .auth-box {
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-top: 3px solid var(--gx-accent);
      padding: 25px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
      transition: all 0.4s ease;
      flex-shrink: 0;
    }

    .cyber-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      outline: none;
      border-radius: 3px;
      transition: border-color 0.2s ease;
      touch-action: manipulation;
    }

    .cyber-input:focus {
      border-color: var(--gx-accent);
      box-shadow: 0 0 8px var(--gx-accent-glow);
    }

    .neon-btn {
      background: var(--gx-accent);
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 3px;
      box-shadow: 0 0 10px var(--gx-accent-glow);
      transition: all 0.2s ease;
      touch-action: manipulation;
    }

    .neon-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px var(--gx-accent-glow);
    }

    .main-player-container {
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      padding: 18px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 15px;
      position: relative;
      transition: all 0.4s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-player-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--gx-accent), transparent);
    }

    .visualizer-wrapper {
      width: 100%;
      height: 75px;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      margin-bottom: 10px;
      position: relative;
      border-radius: 3px;
      overflow: hidden;
      transition: all 0.4s ease;
      flex-shrink: 0;
    }

    #visualizer { width: 100%; height: 100%; }

    .vu-meter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
      font-size: 0.65rem;
      color: var(--gx-text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .vu-track {
      flex: 1;
      height: 4px;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      border-radius: 2px;
      overflow: hidden;
    }
    .vu-fill {
      height: 100%;
      width: 0%;
      background: var(--gx-accent);
      box-shadow: 0 0 8px var(--gx-accent);
      transition: width 0.05s linear;
    }

    .upload-progress-container {
      display: none;
      margin: 10px 0;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      border-radius: 4px;
      padding: 8px 12px;
      transition: border-color 0.4s ease;
      flex-shrink: 0;
    }

    .upload-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--gx-text-muted);
      margin-bottom: 6px;
    }

    .upload-percentage-text {
      color: var(--gx-accent);
      font-weight: 800;
      text-shadow: 0 0 6px var(--gx-accent-glow);
    }

    .upload-progress-track {
      width: 100%;
      height: 6px;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .upload-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gx-accent);
      box-shadow: 0 0 10px var(--gx-accent-glow);
      transition: width 0.15s ease-out, background-color 0.4s ease;
    }

    .lyrics-display {
      min-height: 30px;
      font-size: 0.8rem;
      color: var(--gx-accent);
      text-align: center;
      margin: 8px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .info-display { text-align: center; margin-bottom: 12px; flex-shrink: 0; }
    .player-title { font-weight: 700; color: var(--gx-text); font-size: 1rem; letter-spacing: 0.5px; }
    .player-artist { font-size: 0.8rem; color: var(--gx-text-muted); margin-top: 2px; }

    .player-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .player-btn {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 0.85rem;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .player-btn:hover {
      background: var(--gx-accent);
      border-color: var(--gx-accent);
      color: #fff;
      box-shadow: 0 0 12px var(--gx-accent-glow);
    }

    .player-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--gx-text-muted);
      flex-shrink: 0;
    }

    .player-progress input[type="range"] {
      flex: 1;
      height: 4px;
      appearance: none;
      background: var(--gx-bg);
      border-radius: 2px;
      outline: none;
    }

    .player-progress input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gx-accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--gx-accent);
    }

    .skin-sony { background: var(--gx-surface-card); border: 1px solid var(--gx-border); }
    .skin-sony .sony-brand { font-weight: bold; color: var(--gx-accent); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 8px; }

    .skin-walkman { background: var(--gx-surface); border: 1px solid var(--gx-accent); }
    .skin-walkman .walkman-logo { color: var(--gx-accent); font-weight: bold; font-size: 0.8rem; }
    .cassette-window {
      background: var(--gx-bg); height: 40px; border: 1px solid var(--gx-border);
      display: flex; align-items: center; justify-content: space-around; margin: 8px 0; border-radius: 4px;
      flex-shrink: 0;
    }
    .cassette-reel {
      width: 20px; height: 20px; border-radius: 50%; border: 2px dashed var(--gx-accent);
      animation: spin 3s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* CORRECCIÓN 4: Lista de canciones con Scroll Único y reservación de scrollbar */
    .track-list { 
      list-style: none; 
      margin-top: 10px; 
      max-height: 200px; 
      overflow-y: auto; 
      overflow-x: hidden;
      scrollbar-gutter: stable; /* Evita desplazamientos horizontales cuando sale el scrollbar */
      overscroll-behavior: contain;
    }

    .track-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px; border-bottom: 1px solid var(--gx-border); font-size: 0.8rem;
      background: var(--gx-surface-card); margin-bottom: 4px; border-radius: 2px;
      transition: all 0.3s ease;
    }
    .track-meta { cursor: pointer; flex: 1; }
    .track-actions { display: flex; gap: 5px; }
    .action-btn { background: var(--gx-bg); border: 1px solid var(--gx-border); color: var(--gx-text-muted); font-size: 0.7rem; cursor: pointer; padding: 4px 8px; border-radius: 2px; }
    .action-btn:hover { border-color: var(--gx-accent); color: var(--gx-accent); }
    .action-btn.danger:hover { border-color: #ff3333; color: #ff3333; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;
    }
    .modal-content { background: var(--gx-surface); border: 1px solid var(--gx-border); padding: 20px; border-radius: 6px; width: 80%; max-width: 320px; }
    
        /* Estilos temáticos para la piel Radioactive */
    body.skin-radioactive .neon-btn {
      background: #39ff14;
      color: #000000; /* Texto negro para contraste máximo */
      font-weight: 900;
      letter-spacing: 1px;
    }

    body.skin-radioactive .neon-btn:hover {
      background: #ffee00; /* Cambia a amarillo de advertencia al pasar el cursor */
      box-shadow: 0 0 15px rgba(255, 238, 0, 0.6);
    }

    body.skin-radioactive .lyrics-display,
    body.skin-radioactive .upload-percentage-text {
      color: #ffee00; /* Mantener alertas y lírica en amarillo radioactivo */
      text-shadow: 0 0 8px rgba(255, 238, 0, 0.5);
    }

    body.skin-radioactive .action-btn:hover {
      border-color: #ffee00;
      color: #ffee00;
    }

</style>
</head>
<body>

  <canvas id="tv-static-canvas"></canvas>
  <audio id="audio-player" crossorigin="anonymous"></audio>
  <input type="file" id="lrc-file-input" accept=".lrc" style="display:none;">

  <div class="app-container">
    <div class="navbar" id="app-navbar">
      <span style="font-weight: bold; font-size: 0.9rem; letter-spacing: 1px;">GX//AUDIO</span>
      <div class="dropdown">
        <button class="menu-btn" id="btn-toggle-menu">MENÚ ▼</button>
        <div class="dropdown-menu" id="dropdown-menu">
          <div class="dropdown-item" id="menu-library">🎵 MI LIBRERÍA</div>

            <div class="dropdown-item skin-option" data-skin="classic">► GX RED</div>

            <div class="dropdown-item skin-option" data-skin="ultraviolet">► ULTRAVIOLET</div>
            <div class="dropdown-item skin-option" data-skin="frankenstein">► FRANKENSTEIN</div>
            <div class="dropdown-item skin-option" data-skin="gold">► GOLD</div>
            <div class="dropdown-item skin-option" data-skin="sony">► SONY GX</div>
            <div class="dropdown-item skin-option" data-skin="walkman">► WALKMAN GX</div>
          </div>
          <div class="dropdown-item" id="menu-logout" style="color:var(--gx-accent);">🚪 CERRAR SESIÓN</div>

    <div class="auth-box" id="auth-screen">
      <h2 style="color:var(--gx-accent); margin-bottom: 10px; font-size: 1.1rem; letter-spacing: 1px;">OPERA GX AUDIO SYSTEM</h2>
      <p style="font-size: 0.75rem; margin-bottom: 15px; color: var(--gx-text-muted);">ACCESO REQUERIDO</p>
      <input type="email" id="auth-email" class="cyber-input" placeholder="EMAIL">
      <input type="password" id="auth-password" class="cyber-input" placeholder="CONTRASEÑA">

        <button class="neon-btn" id="btn-login">LOGIN</button>

      </div>
      <div id="auth-status" style="margin-top: 10px; font-size: 0.7rem; color:var(--gx-accent);"></div>

    <div class="main-player-container skin-classic" id="main-player" style="display:none;"></div>

    <div id="view-library" style="display:none;">

          <div class="upload-progress-fill" id="upload-progress-fill"></div>

      <ul class="track-list" id="library-track-list"></ul>

    <div id="view-playlists" style="display:none;">
      <button class="neon-btn" id="btn-create-playlist" style="width:100%; margin-bottom:10px; font-size:0.8rem;">+ NUEVA PLAYLIST</button>
      <div id="playlists-container"></div>

  <div class="modal" id="modal-add-playlist">
    <div class="modal-content">
      <p style="font-size:0.8rem; margin-bottom:10px;">SELECCIONA PLAYLIST:</p>
      <div id="modal-playlist-options"></div>
      <button class="neon-btn" id="btn-close-modal" style="width:100%; margin-top:10px; background:var(--gx-surface-card);">CANCELAR</button>
    </div>
  </div>

  <script>
    // ESTÁTICA TV DE FONDO
    const staticCanvas = document.getElementById("tv-static-canvas");
    const staticCtx = staticCanvas.getContext("2d");
    let staticAnimationId = null;

    function resizeStaticCanvas() {
      staticCanvas.width = window.innerWidth / 2;
      staticCanvas.height = window.innerHeight / 2;
    }
    window.addEventListener("resize", resizeStaticCanvas);
    resizeStaticCanvas();

    function generateTVStatic() {
      const width = staticCanvas.width;
      const height = staticCanvas.height;
      const imgData = staticCtx.createImageData(width, height);
      const buffer = new Uint32Array(imgData.data.buffer);
      const len = buffer.length;

      for (let i = 0; i < len; i++) {
        const color = Math.random() * 255 | 0;
        buffer[i] = (255 << 24) | (color << 16) | (color << 8) | color;
      }

      staticCtx.putImageData(imgData, 0, 0);
      staticAnimationId = requestAnimationFrame(generateTVStatic);
    }

    function startTVStatic() {
      if (!staticAnimationId) {
        staticCanvas.style.display = "block";
        generateTVStatic();
      }
    }

    function stopTVStatic() {
      if (staticAnimationId) {
        cancelAnimationFrame(staticAnimationId);

      if (!files || !files.length) return;

      if (!currentUser) {
        updateUploadProgress(0, "ERROR: SESIÓN NO INICIADA");

        return;
      }

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const currentFileIndex = i + 1;
        const totalFiles = files.length;
        
        let title = file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
        let artist = "ARTISTA DESCONOCIDO";
        let album = "GX AUDIO";

        updateUploadProgress(0, `[${currentFileIndex}/${totalFiles}] LEYENDO METADATOS...`);

        try {
          if (window.jsmediatags) {
            await new Promise((resolve) => {
              window.jsmediatags.read(file, {
                onSuccess: (tag) => {
                  if (tag.tags.title) title = tag.tags.title;
                  if (tag.tags.artist) artist = tag.tags.artist;
                  if (tag.tags.album) album = tag.tags.album;
                  resolve();
                },
                onError: () => resolve()
              });
            });
          }
        } catch (e) {
          console.warn("Manejador ID3 omitido:", e);
        }

        await uploadFileToSupabaseWithProgress(file, title, artist, album, currentFileIndex, totalFiles);
      }

      hideUploadProgress();

    async function uploadFileToSupabaseWithProgress(file, title, artist, album, fileIndex, totalFiles) {
      const cleanFileName = file.name.toLowerCase().replace(/[^a-z0-9.-]/g, "_");
      const filePath = `${currentUser.id}/${Date.now()}_${cleanFileName}`;

      updateUploadProgress(0, `[${fileIndex}/${totalFiles}] SUBIENDO: ${title}`);

      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const token = sessionData?.session?.access_token;

        if (!token) throw new Error("No hay token de sesión activo");

        // Uso de XMLHttpRequest para capturar el progreso de carga por bytes real
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const uploadUrl = `${SUPABASE_URL}/storage/v1/object/audio-tracks/${filePath}`;

          xhr.upload.addEventListener("progress", (e) => {
            if (e.lengthComputable) {
              const percent = (e.loaded / e.total) * 100;
              updateUploadProgress(percent, `[${fileIndex}/${totalFiles}] SUBIENDO: ${title}`);
            }
          });

          xhr.addEventListener("load", () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              updateUploadProgress(100, `[${fileIndex}/${totalFiles}] ¡SUBIDA OK!`);
              resolve();
            } else {
              reject(new Error(`Error ${xhr.status}: ${xhr.statusText}`));
            }
          });

          xhr.addEventListener("error", () => reject(new Error("Error de red durante la subida")));
          xhr.addEventListener("abort", () => reject(new Error("Subida cancelada")));

          xhr.open("POST", uploadUrl);
          xhr.setRequestHeader("Authorization", `Bearer ${token}`);
          xhr.setRequestHeader("x-upsert", "true");
          xhr.setRequestHeader("cache-control", "3600");
          xhr.setRequestHeader("content-type", file.type || "audio/mpeg");
          
          xhr.send(file);
        });

        await loadCloudTracks();
      } catch (err) {
        console.error("Upload Error:", err);
        updateUploadProgress(0, `ERROR: ${err.message}`);
      }
    }

    function parseLRC(lrcText) {
      lyricsData = [];
      const lines = lrcText.split("\n");
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

      lines.forEach(line => {
        const match = timeRegex.exec(line);
        if (match) {
          const minutes = parseInt(match[1]);
          const seconds = parseInt(match[2]);
          const millis = parseInt(match[3].padEnd(3, '0'));
          const time = minutes * 60 + seconds + millis / 1000;
          const text = line.replace(timeRegex, "").trim();
          if (text) lyricsData.push({ time, text });
        }
      });
      lyricsData.sort((a, b) => a.time - b.time);
    }

      audio.load();
      lyricsData = [];

      if (window.jsmediatags && song.src) {

            if (tags.album) song.album = tags.album;

    audio.addEventListener("timeupdate", () => {
      const progressBar = document.getElementById("player-progress-bar");
      const currentTimeEl = document.getElementById("player-current-time");
      const totalDurationEl = document.getElementById("player-total-duration");
      const lyricsDisplay = document.getElementById("lyrics-display");

      if (audio.duration) {
        if (progressBar) progressBar.value = (audio.currentTime / audio.duration) * 100;
        if (currentTimeEl) currentTimeEl.innerText = formatTime(audio.currentTime);
        if (totalDurationEl) totalDurationEl.innerText = formatTime(audio.duration);
      }

      if (lyricsData.length > 0 && lyricsDisplay) {
        const currentLyric = lyricsData.slice().reverse().find(l => audio.currentTime >= l.time);
        lyricsDisplay.innerText = currentLyric ? currentLyric.text : "...";
      }
    });

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function initAudioGraph() {
      if (audioGraphInitialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        audioGraphInitialized = true;
        drawVisualizer();
      } catch (e) { console.log(e); }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      canvas = document.getElementById("visualizer");
      if (!canvas || !viewLibrary.clientWidth) return;
      canvasCtx = canvas.getContext("2d");

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const width = canvas.width, height = canvas.height;

      canvasCtx.clearRect(0, 0, width, height);

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const freqData = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(freqData);

      let sum = 0;
      for (let i = 0; i < bufferLength; i++) { sum += freqData[i]; }
      const averagePeak = sum / bufferLength;
      const vuFill = document.getElementById("vu-fill");
      if (vuFill) vuFill.style.width = `${Math.min(100, (averagePeak / 180) * 100)}%`;

      const computedAccent = getComputedStyle(document.body).getPropertyValue('--gx-accent').trim() || '#ff0055';

      if (visualizerMode === "bars") {
        const barWidth = (width / bufferLength) * 1.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (freqData[i] / 255) * height * 0.85;

          let gradient = canvasCtx.createLinearGradient(0, height, 0, 0);
          gradient.addColorStop(0, computedAccent);
          gradient.addColorStop(0.7, "#ffffff");
          gradient.addColorStop(1, "#ffffff");

          canvasCtx.fillStyle = gradient;
          canvasCtx.fillRect(x, height - barHeight, barWidth - 2, barHeight);
          x += barWidth;
        }
      } else if (visualizerMode === "wave") {
        const timeData = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(timeData);

        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = computedAccent;
        canvasCtx.beginPath();

        const sliceWidth = width / analyser.fftSize;
        let x = 0;

        for (let i = 0; i < analyser.fftSize; i++) {
          const v = timeData[i] / 128.0;
          const y = (v * height) / 2;

          if (i === 0) canvasCtx.moveTo(x, y);
          else canvasCtx.lineTo(x, y);

          x += sliceWidth;
        }

        canvasCtx.lineTo(width, height / 2);
        canvasCtx.stroke();
      }
    }
  </script>
</body>
</html>
