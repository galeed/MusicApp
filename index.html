<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Audio Player</title>
  <!-- Fuente Cyberpunk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Orbitron', monospace, sans-serif; 
    }

    body {
      background-color: #050508;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: #00f3ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px;
    }

    .player-card {
      background: rgba(10, 10, 18, 0.85); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.3); 
      border-radius: 16px; 
      padding: 24px 20px;
      width: 100%; 
      max-width: 380px; 
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
    }

    /* Glitch Title */
    .glitch-wrapper { 
      text-align: center; 
      margin-bottom: 20px; 
    }

    .glitch { 
      font-size: 1.4rem; 
      font-weight: 900; 
      letter-spacing: 2px; 
      color: #00f3ff; 
      position: relative; 
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8); 
    }

    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .glitch::before {
      left: -2px;
      text-shadow: 2px 0 #ff0055;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }

    .glitch::after {
      left: 2px;
      text-shadow: -2px 0 #00f3ff;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip: rect(12px, 9999px, 30px, 0); }
      20% { clip: rect(25px, 9999px, 5px, 0); }
      40% { clip: rect(2px, 9999px, 38px, 0); }
      60% { clip: rect(32px, 9999px, 15px, 0); }
      80% { clip: rect(10px, 9999px, 28px, 0); }
      100% { clip: rect(18px, 9999px, 3px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(22px, 9999px, 8px, 0); }
      25% { clip: rect(2px, 9999px, 35px, 0); }
      50% { clip: rect(30px, 9999px, 12px, 0); }
      75% { clip: rect(15px, 9999px, 25px, 0); }
      100% { clip: rect(8px, 9999px, 38px, 0); }
    }

    /* Upload button */
    .file-upload-wrapper { 
      margin-bottom: 20px; 
      text-align: center; 
    }

    #file-input { 
      display: none; 
    }

    .custom-file-btn { 
      display: block; 
      color: #ff0055; 
      border: 1px solid #ff0055; 
      padding: 10px; 
      border-radius: 8px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); 
      transition: all 0.2s ease;
    }

    .custom-file-btn:active {
      background: #ff0055;
      color: #000;
      box-shadow: 0 0 20px #ff0055;
    }

    /* Track info */
    .track-info { 
      text-align: center; 
      margin-bottom: 20px; 
    }

    .track-info h2 { 
      font-size: 0.95rem; 
      color: #ffffff; 
      margin-bottom: 6px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .track-info p { 
      color: rgba(0, 243, 255, 0.6); 
      font-size: 0.75rem; 
    }

    /* Progress bar */
    .progress-container { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      margin-bottom: 20px; 
      font-size: 0.7rem; 
      color: #00f3ff;
    }

    .progress-container input[type="range"] { 
      flex: 1; 
      -webkit-appearance: none; 
      background: #12121c; 
      height: 6px; 
      border-radius: 3px;
      border: 1px solid rgba(0, 243, 255, 0.3); 
      outline: none;
    }

    .progress-container input[type="range"]::-webkit-slider-thumb { 
      -webkit-appearance: none; 
      width: 14px; 
      height: 14px; 
      border-radius: 50%; 
      background: #ff0055; 
      box-shadow: 0 0 10px #ff0055; 
      cursor: pointer;
    }

    /* Controls */
    .controls { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 24px; 
    }

    .controls button { 
      flex: 1; 
      background: rgba(0, 243, 255, 0.05); 
      color: #00f3ff; 
      border: 1px solid #00f3ff; 
      padding: 12px 0; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 0.85rem; 
      letter-spacing: 1px;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
      transition: all 0.2s ease;
    }

    .controls button:active {
      background: #00f3ff;
      color: #050508;
      box-shadow: 0 0 18px #00f3ff;
    }

    /* Playlist */
    .playlist-container h3 { 
      font-size: 0.75rem; 
      color: #ff0055; 
      margin-bottom: 10px; 
      border-bottom: 1px solid rgba(255, 0, 85, 0.3); 
      padding-bottom: 4px;
      letter-spacing: 1px;
    }

    .playlist-container ul { 
      list-style: none; 
      max-height: 150px; 
      overflow-y: auto; 
    }

    .playlist-container li { 
      padding: 10px; 
      font-size: 0.75rem; 
      color: #a0a0b0; 
      background: rgba(255, 255, 255, 0.02); 
      margin-bottom: 4px; 
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-container li.active { 
      color: #00f3ff; 
      border-color: #00f3ff; 
      background: rgba(0, 243, 255, 0.1); 
      box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="glitch-wrapper">
      <h1 class="glitch" data-text="NEON//AUDIO">NEON//AUDIO</h1>
    </div>

    <!-- Filtro de archivos actualizado con soporte para audios de alta calidad -->
    <div class="file-upload-wrapper">
      <label for="file-input" class="custom-file-btn">⚡ CARGAR AUDIO (.WAV / .FLAC)</label>
      <input type="file" id="file-input" accept="audio/*,.wav,.flac,.mp3" multiple>
    </div>

    <div class="track-info">
      <h2 id="track-title">SELECCIONA PISTA</h2>
      <p id="track-artist">SYSTEM//READY</p>
    </div>

    <div class="progress-container">
      <span id="current-time">0:00</span>
      <input type="range" id="progress-bar" value="0" min="0" step="0.1">
      <span id="total-duration">0:00</span>
    </div>

    <div class="controls">
      <button id="btn-prev">⏮</button>
      <button id="btn-play">▶ PLAY</button>
      <button id="btn-next">⏭</button>
    </div>

    <audio id="audio-player"></audio>

    <div class="playlist-container">
      <h3>PLAYLIST//CYBER</h3>
      <ul id="playlist"></ul>
    </div>
  </div>

  <script>
    const songs = []; 
    let currentSongIndex = 0; 
    let isPlaying = false;

    const audio = document.getElementById("audio-player");
    const title = document.getElementById("track-title");
    const artist = document.getElementById("track-artist");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalDurationEl = document.getElementById("total-duration");
    const playlistEl = document.getElementById("playlist");
    const fileInput = document.getElementById("file-input");

    // Lógica optimizada de selección de archivos para iOS
    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      songs.length = 0; // Limpiar lista anterior

      files.forEach(file => {
        const objectUrl = URL.createObjectURL(file);
        songs.push({ 
          title: file.name.replace(/\.[^/.]+$/, ""), 
          artist: "AUDIO//LOCAL", 
          src: objectUrl 
        });
      });

      renderPlaylist(); 
      currentSongIndex = 0; 
      loadSong(songs[0]);
      playSong();
    });

    function loadSong(song) { 
      if (!song) return; 
      title.innerText = song.title; 
      artist.innerText = song.artist;
      
      // Forzar recarga del elemento de audio para Safari / iOS
      audio.src = song.src; 
      audio.load();
      
      updatePlaylistHighlight(); 
    }

    function playSong() { 
      if (songs.length === 0) return; 

      // Manejo de promesa para prevenir bloqueos de autoplay en iOS
      const playPromise = audio.play();
      
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            isPlaying = true; 
            btnPlay.innerText = "⏸ PAUSE";
          })
          .catch(error => {
            console.log("Audio listo. Toca PLAY para iniciar reproducción.", error);
            isPlaying = false;
            btnPlay.innerText = "▶ PLAY";
          });
      }
    }

    function pauseSong() { 
      isPlaying = false; 
      btnPlay.innerText = "▶ PLAY"; 
      audio.pause(); 
    }

    btnPlay.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      isPlaying ? pauseSong() : playSong(); 
    });

    btnPrev.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; 
      loadSong(songs[currentSongIndex]); 
      playSong(); 
    });

    btnNext.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      currentSongIndex = (currentSongIndex + 1) % songs.length; 
      loadSong(songs[currentSongIndex]); 
      playSong(); 
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.innerText = formatTime(audio.currentTime);
        totalDurationEl.innerText = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => { 
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration; 
      }
    });

    audio.addEventListener("ended", () => btnNext.click());

    function formatTime(seconds) { 
      const min = Math.floor(seconds / 60); 
      const sec = Math.floor(seconds % 60); 
      return `${min}:${sec < 10 ? '0' : ''}${sec}`; 
    }

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      songs.forEach((song, i) => {
        const li = document.createElement("li"); 
        li.innerText = `> ${song.title}`;
        li.addEventListener("click", () => { 
          currentSongIndex = i; 
          loadSong(songs[currentSongIndex]); 
          playSong(); 
        });
        playlistEl.appendChild(li);
      });
    }

    function updatePlaylistHighlight() {
      playlistEl.querySelectorAll("li").forEach((item, i) => { 
        i === currentSongIndex ? item.classList.add("active") : item.classList.remove("active"); 
      });
    }
  </script>
</body>
</html>
