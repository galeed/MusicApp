<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Opera GX Audio System + Advanced Player</title>

  <!-- Librería jsmediatags -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* VARIABLES Y PALETAS DE FONDOS OPERA GX */
    :root {
      --gx-bg: #0d0e12;
      --gx-surface: #14161d;
      --gx-surface-card: #1c1e26;
      --gx-accent: #ff0055;
      --gx-accent-glow: rgba(255, 0, 85, 0.4);
      --gx-text: #ffffff;
      --gx-text-muted: #8e94a0;
      --gx-border: #2a2e3d;
      --gx-font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --audio-spec-color: #8ab4f8;
    }

    body.skin-purple {
      --gx-bg: #0f0914;
      --gx-surface: #181122;
      --gx-surface-card: #221830;
      --gx-accent: #9d4edd;
      --gx-accent-glow: rgba(157, 78, 221, 0.4);
      --gx-border: #36244d;
    }

    body.skin-ultraviolet {
      --gx-bg: #05131a;
      --gx-surface: #0a1f29;
      --gx-surface-card: #102a38;
      --gx-accent: #00f0ff;
      --gx-accent-glow: rgba(0, 240, 255, 0.4);
      --gx-border: #1a4257;
    }

    body.skin-frankenstein {
      --gx-bg: #07120a;
      --gx-surface: #0d1f12;
      --gx-surface-card: #142a1a;
      --gx-accent: #00ff66;
      --gx-accent-glow: rgba(0, 255, 102, 0.4);
      --gx-border: #1e4527;
      --audio-spec-color: #39ff14;
    }

    body.skin-gold {
      --gx-bg: #14100b;
      --gx-surface: #1f1a13;
      --gx-surface-card: #2a231b;
      --gx-accent: #e0a96d;
      --gx-accent-glow: rgba(224, 169, 109, 0.4);
      --gx-border: #423628;
      --audio-spec-color: #d4af37;
    }

    body.skin-sony {
      --gx-bg: #0a0a0c;
      --gx-surface: #121318;
      --gx-surface-card: #1a1b22;
      --gx-accent: #3b82f6;
      --gx-accent-glow: rgba(59, 130, 246, 0.4);
      --gx-border: #252836;
      --audio-spec-color: #66fcf1;
    }

    body.skin-walkman {
      --gx-bg: #120e08;
      --gx-surface: #1c1710;
      --gx-surface-card: #262018;
      --gx-accent: #ff9900;
      --gx-accent-glow: rgba(255, 153, 0, 0.4);
      --gx-border: #3d3122;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--gx-font);
    }

    body {
      background-color: var(--gx-bg);
      color: var(--gx-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(var(--gx-border) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.3;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #tv-static-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      opacity: 0.12;
      pointer-events: none;
    }

    body.logged-in:has(#main-player.playing) {
      background-image: 
        radial-gradient(circle at 50% 30%, var(--gx-accent-glow) 0%, transparent 70%),
        linear-gradient(180deg, var(--gx-surface) 0%, var(--gx-bg) 100%);
    }

    body.logged-in:has(#main-player.playing)::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .app-container {
      width: 90%;
      max-width: 480px;
      z-index: 20;
      margin: 20px auto;
      position: relative;
    }

    .glitch-effect {
      animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }

    .navbar {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-left: 3px solid var(--gx-accent);
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
    }

    .menu-btn {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    .menu-btn:hover {
      border-color: var(--gx-accent);
      color: var(--gx-accent);
      box-shadow: 0 0 10px var(--gx-accent-glow);
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 35px;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      min-width: 170px;
      z-index: 100;
      border-radius: 4px;
      overflow: hidden;
    }

    .dropdown-menu.show { display: block; }

    .dropdown-item {
      padding: 10px 14px;
      color: var(--gx-text-muted);
      cursor: pointer;
      border-bottom: 1px solid var(--gx-border);
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .dropdown-item:hover {
      background: var(--gx-surface-card);
      color: var(--gx-accent);
      padding-left: 18px;
    }

    .submenu { display: none; padding-left: 10px; background: rgba(0,0,0,0.3); }
    .submenu.show { display: block; }

    .auth-box {
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-top: 3px solid var(--gx-accent);
      padding: 25px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
      transition: all 0.4s ease;
    }

    .cyber-input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      outline: none;
      border-radius: 3px;
      transition: border-color 0.2s ease;
    }

    .cyber-input:focus {
      border-color: var(--gx-accent);
      box-shadow: 0 0 8px var(--gx-accent-glow);
    }

    .neon-btn {
      background: var(--gx-accent);
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 3px;
      box-shadow: 0 0 10px var(--gx-accent-glow);
      transition: all 0.2s ease;
    }

    .neon-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px var(--gx-accent-glow);
    }

    .main-player-container {
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      padding: 18px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 15px;
      position: relative;
      transition: all 0.4s ease;
    }

    .main-player-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--gx-accent), transparent);
    }

    .cover-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0;
      position: relative;
    }

    .cover-art {
      width: 100%;
      max-width: 160px;
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      object-fit: cover;
      display: block;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--gx-border);
      z-index: 2;
    }

    .visualizer-canvas {
      position: absolute;
      width: 180px;
      height: 180px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

    .lyrics-container {
      position: absolute;
      width: 160px;
      height: 160px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--gx-border);
      border-radius: 4px;
      padding: 10px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 3;
      backdrop-filter: blur(10px);
      overflow-y: auto;
      text-align: center;
    }

    .lyrics-text {
      font-size: 0.75rem;
      color: var(--gx-accent);
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .vu-meter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
      font-size: 0.65rem;
      color: var(--gx-text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .vu-track {
      flex: 1;
      height: 4px;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      border-radius: 2px;
      overflow: hidden;
    }
    .vu-fill {
      height: 100%;
      width: 0%;
      background: var(--gx-accent);
      box-shadow: 0 0 8px var(--gx-accent);
      transition: width 0.05s linear;
    }

    .upload-progress-container {
      display: none;
      margin: 10px 0;
      background: var(--gx-bg);
      border: 1px solid var(--gx-border);
      border-radius: 4px;
      padding: 8px 12px;
    }

    .upload-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--gx-text-muted);
      margin-bottom: 6px;
    }

    .upload-percentage-text {
      color: var(--gx-accent);
      font-weight: 800;
      text-shadow: 0 0 6px var(--gx-accent-glow);
    }

    .upload-progress-track {
      width: 100%;
      height: 6px;
      background: var(--gx-surface);
      border: 1px solid var(--gx-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .upload-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gx-accent);
      box-shadow: 0 0 10px var(--gx-accent-glow);
      transition: width 0.15s ease-out;
    }

    .info-display { text-align: center; margin-bottom: 10px; }
    .player-title { font-weight: 700; color: var(--gx-text); font-size: 0.95rem; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 0.78rem; color: var(--gx-text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-album { font-size: 0.7rem; color: var(--gx-text-muted); opacity: 0.8; margin-top: 1px; }

    .audio-specs-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--audio-spec-color);
      margin: 4px 0;
      text-transform: uppercase;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .player-btn {
      background: var(--gx-surface-card);
      border: 1px solid var(--gx-border);
      color: var(--gx-text);
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 0.8rem;
      transition: all 0.15s ease;
    }

    .player-btn:hover {
      background: var(--gx-accent);
      border-color: var(--gx-accent);
      color: #fff;
      box-shadow: 0 0 12px var(--gx-accent-glow);
    }

    .btn-play-big {
      background: var(--gx-text);
      color: var(--gx-bg);
      font-weight: bold;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--gx-text-muted);
    }

    .player-progress input[type="range"] {
      flex: 1;
      height: 4px;
      appearance: none;
      background: var(--gx-bg);
      border-radius: 2px;
      outline: none;
    }

    .player-progress input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gx-accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--gx-accent);
    }

    .skin-sony { background: var(--gx-surface-card); border: 1px solid var(--gx-border); }
    .skin-sony .sony-brand { font-weight: bold; color: var(--gx-accent); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 8px; }

    .skin-walkman { background: var(--gx-surface); border: 1px solid var(--gx-accent); }
    .skin-walkman .walkman-logo { color: var(--gx-accent); font-weight: bold; font-size: 0.8rem; }
    .cassette-window {
      background: var(--gx-bg); height: 35px; border: 1px solid var(--gx-border);
      display: flex; align-items: center; justify-content: space-around; margin: 6px 0; border-radius: 4px;
    }
    .cassette-reel {
      width: 18px; height: 18px; border-radius: 50%; border: 2px dashed var(--gx-accent);
      animation: spin 3s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .track-list { list-style: none; margin-top: 10px; max-height: 180px; overflow-y: auto; }
    .track-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px; border-bottom: 1px solid var(--gx-border); font-size: 0.8rem;
      background: var(--gx-surface-card); margin-bottom: 4px; border-radius: 2px;
      transition: all 0.3s ease;
    }
    .track-meta { cursor: pointer; flex: 1; }
    .track-actions { display: flex; gap: 5px; }
    .action-btn { background: var(--gx-bg); border: 1px solid var(--gx-border); color: var(--gx-text-muted); font-size: 0.7rem; cursor: pointer; padding: 4px 8px; border-radius: 2px; }
    .action-btn:hover { border-color: var(--gx-accent); color: var(--gx-accent); }
    .action-btn.danger:hover { border-color: #ff3333; color: #ff3333; }

    .eq-container {
      display: flex; justify-content: space-between; background: var(--gx-surface);
      padding: 10px; border: 1px solid var(--gx-border); border-radius: 4px; margin-top: 10px; font-size: 0.75rem;
    }
    .eq-band { display: flex; flex-direction: column; align-items: center; color: var(--gx-text-muted); }
    .eq-band input[type="range"] { accent-color: var(--gx-accent); margin-top: 5px; width: 100%; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center;
    }
    .modal-content { background: var(--gx-surface); border: 1px solid var(--gx-border); padding: 20px; border-radius: 6px; width: 80%; max-width: 320px; }
  </style>
</head>
<body>

  <canvas id="tv-static-canvas"></canvas>

  <script>
    // ESTÁTICA TV DE FONDO
    const staticCanvas = document.getElementById("tv-static-canvas");
    const staticCtx = staticCanvas.getContext("2d");
    let staticAnimationId = null;

    function resizeStaticCanvas() {
      staticCanvas.width = window.innerWidth / 2;
      staticCanvas.height = window.innerHeight / 2;
    }
    window.addEventListener("resize", resizeStaticCanvas);
    resizeStaticCanvas();

    function generateTVStatic() {
      const width = staticCanvas.width;
      const height = staticCanvas.height;
      const imgData = staticCtx.createImageData(width, height);
      const buffer = new Uint32Array(imgData.data.buffer);
      const len = buffer.length;

      for (let i = 0; i < len; i++) {
        const color = Math.random() * 255 | 0;
        buffer[i] = (255 << 24) | (color << 16) | (color << 8) | color;
      }
      staticCtx.putImageData(imgData, 0, 0);
      staticAnimationId = requestAnimationFrame(generateTVStatic);
    }

    function startTVStatic() {
      if (!staticAnimationId) {
        staticCanvas.style.display = "block";

        try {

                  resolve();
                },

            });

        await uploadFileToSupabaseWithProgress(file, title, artist, album, i+1, files.length);

    async function uploadFileToSupabaseWithProgress(file, title, artist, album, fileIndex, totalFiles) {
      const cleanFileName = file.name.toLowerCase().replace(/[^a-z0-9.-]/g, "_");
      const filePath = `${currentUser.id}/${Date.now()}_${cleanFileName}`;

      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const token = sessionData?.session?.access_token;
        if (!token) throw new Error("No hay token activo");

        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const uploadUrl = `${SUPABASE_URL}/storage/v1/object/audio-tracks/${filePath}`;

          xhr.upload.addEventListener("progress", (e) => {
            if (e.lengthComputable) {
              const percent = (e.loaded / e.total) * 100;
              updateUploadProgress(percent, `[${fileIndex}/${totalFiles}] SUBIENDO: ${title}`);
            }
          });

          xhr.addEventListener("load", () => {
            if (xhr.status >= 200 && xhr.status < 300) resolve();
            else reject(new Error(`Error ${xhr.status}`));
          });

          xhr.addEventListener("error", () => reject(new Error("Error de red")));
          xhr.open("POST", uploadUrl);
          xhr.setRequestHeader("Authorization", `Bearer ${token}`);
          xhr.setRequestHeader("x-upsert", "true");
          xhr.setRequestHeader("content-type", file.type || "audio/mpeg");
          xhr.send(file);
        });
        await loadCloudTracks();
      } catch (err) {
        updateUploadProgress(0, `ERROR: ${err.message}`);
      }
    }

    // WEB AUDIO GRAPH & VISUALIZER (Del código 16)
    let audioCtx, analyser, sourceNode, lowFilter, midFilter, highFilter, audioGraphInitialized = false;
    let animationId = null;

    function initAudioGraph() {
      if (audioGraphInitialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        const savedLow = localStorage.getItem("musicapp_eq_low") || "0";
        const savedMid = localStorage.getItem("musicapp_eq_mid") || "0";
        const savedHigh = localStorage.getItem("musicapp_eq_high") || "0";

        document.getElementById("eq-low").value = savedLow;
        document.getElementById("eq-mid").value = savedMid;
        document.getElementById("eq-high").value = savedHigh;

        lowFilter = audioCtx.createBiquadFilter();
        lowFilter.type = "lowshelf"; lowFilter.frequency.value = 60;
        lowFilter.gain.value = parseFloat(savedLow);

        midFilter = audioCtx.createBiquadFilter();
        midFilter.type = "peaking"; midFilter.frequency.value = 1000; midFilter.Q.value = 1.0;
        midFilter.gain.value = parseFloat(savedMid);

        highFilter = audioCtx.createBiquadFilter();
        highFilter.type = "highshelf"; highFilter.frequency.value = 10000;
        highFilter.gain.value = parseFloat(savedHigh);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(lowFilter);
        lowFilter.connect(midFilter);
        midFilter.connect(highFilter);
        highFilter.connect(analyser);
        analyser.connect(audioCtx.destination);

        audioGraphInitialized = true;
        startVisualizer();
      } catch (e) { console.warn("WebAudio no disponible", e); }
    }

    document.getElementById("eq-low").addEventListener("input", (e) => {
      if(lowFilter) lowFilter.gain.value = parseFloat(e.target.value);
      localStorage.setItem("musicapp_eq_low", e.target.value);
    });
    document.getElementById("eq-mid").addEventListener("input", (e) => {
      if(midFilter) midFilter.gain.value = parseFloat(e.target.value);
      localStorage.setItem("musicapp_eq_mid", e.target.value);
    });
    document.getElementById("eq-high").addEventListener("input", (e) => {
      if(highFilter) highFilter.gain.value = parseFloat(e.target.value);
      localStorage.setItem("musicapp_eq_high", e.target.value);

    function startVisualizer() {
      const canvas = document.getElementById("visualizerCanvas");
      if (!canvas || !analyser) return;
      const canvasCtx = canvas.getContext("2d");
      canvas.width = 180;
      canvas.height = 180;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

        let sum = 0;
        for (let i = 0; i < bufferLength; i++) { sum += dataArray[i]; }
        const averagePeak = sum / bufferLength;
        const vuFill = document.getElementById("vu-fill");
        if (vuFill) vuFill.style.width = `${Math.min(100, (averagePeak / 150) * 100)}%`;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 75;
        const bars = 32;
        const angleStep = (Math.PI * 2) / bars;

        canvasCtx.save();
        canvasCtx.translate(centerX, centerY);

        for (let i = 0; i < bars; i++) {
          const barHeight = (dataArray[i] / 255) * 30;
          const x1 = Math.cos(i * angleStep) * radius;
          const y1 = Math.sin(i * angleStep) * radius;
          const x2 = Math.cos(i * angleStep) * (radius + barHeight);
          const y2 = Math.sin(i * angleStep) * (radius + barHeight);

          canvasCtx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--gx-accent').trim() || '#ff0055';
          canvasCtx.lineWidth = 3;
          canvasCtx.lineCap = "round";

          canvasCtx.beginPath();
          canvasCtx.moveTo(x1, y1);
          canvasCtx.lineTo(x2, y2);
          canvasCtx.stroke();
        }
        canvasCtx.restore();
      }
      if (animationId) cancelAnimationFrame(animationId);
      draw();
    }
  </script>
</body>
