<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Audio Player + Auth</title>
  
  <!-- Fuente Cyberpunk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- SDK Cliente Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Orbitron', monospace, sans-serif; 
    }

    body {
      background-color: #050508;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: #00f3ff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px;
    }

    .player-card {
      background: rgba(10, 10, 18, 0.85); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.3); 
      border-radius: 16px; 
      padding: 24px 20px;
      width: 100%; 
      max-width: 380px; 
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
    }

    /* Título Glitch */
    .glitch-wrapper { 
      text-align: center; 
      margin-bottom: 20px; 
    }

    .glitch { 
      font-size: 1.4rem; 
      font-weight: 900; 
      letter-spacing: 2px; 
      color: #00f3ff; 
      position: relative; 
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8); 
    }

    /* --- ESTILOS DE AUTENTICACIÓN --- */
    .auth-section {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 0, 85, 0.4);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }

    .auth-section h3 {
      font-size: 0.8rem;
      color: #ff0055;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .neon-input {
      width: 100%;
      background: #0d0d14;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 6px;
      padding: 10px;
      color: #ffffff;
      font-size: 0.75rem;
      margin-bottom: 10px;
      outline: none;
    }

    .neon-input:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    .auth-buttons {
      display: flex;
      gap: 8px;
    }

    .neon-btn {
      flex: 1;
      background: rgba(0, 243, 255, 0.1);
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .neon-btn-secondary {
      flex: 1;
      background: rgba(255, 0, 85, 0.1);
      color: #ff0055;
      border: 1px solid #ff0055;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .neon-btn-danger {
      width: 100%;
      background: rgba(255, 0, 85, 0.2);
      color: #ff0055;
      border: 1px solid #ff0055;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    #auth-status {
      font-size: 0.65rem;
      margin-top: 8px;
      color: #ff0055;
      word-break: break-word;
    }

    .user-info {
      font-size: 0.7rem;
      color: #00f3ff;
      text-align: center;
    }

    /* Botón de carga */
    .file-upload-wrapper { 
      margin-bottom: 20px; 
      text-align: center; 
    }

    #file-input { display: none; }

    .custom-file-btn { 
      display: block; 
      color: #ff0055; 
      border: 1px solid #ff0055; 
      padding: 10px; 
      border-radius: 8px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); 
    }

    /* Pista y reproductor */
    .track-info { text-align: center; margin-bottom: 20px; }
    .track-info h2 { font-size: 0.95rem; color: #ffffff; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info p { color: rgba(0, 243, 255, 0.6); font-size: 0.75rem; }

    .progress-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 0.7rem; color: #00f3ff; }
    .progress-container input[type="range"] { flex: 1; -webkit-appearance: none; background: #12121c; height: 6px; border-radius: 3px; border: 1px solid rgba(0, 243, 255, 0.3); outline: none; }
    .progress-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff0055; box-shadow: 0 0 10px #ff0055; }

    .controls { display: flex; gap: 10px; margin-bottom: 24px; }
    .controls button { flex: 1; background: rgba(0, 243, 255, 0.05); color: #00f3ff; border: 1px solid #00f3ff; padding: 12px 0; border-radius: 8px; font-weight: 700; font-size: 0.85rem; }

    .playlist-container h3 { font-size: 0.75rem; color: #ff0055; margin-bottom: 10px; border-bottom: 1px solid rgba(255, 0, 85, 0.3); padding-bottom: 4px; }
    .playlist-container ul { list-style: none; max-height: 120px; overflow-y: auto; }
    .playlist-container li { padding: 8px; font-size: 0.7rem; color: #a0a0b0; background: rgba(255, 255, 255, 0.02); margin-bottom: 4px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .playlist-container li.active { color: #00f3ff; border: 1px solid #00f3ff; background: rgba(0, 243, 255, 0.1); }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="glitch-wrapper">
      <h1 class="glitch" data-text="NEON//AUDIO">NEON//AUDIO</h1>
    </div>

    <!-- MÓDULO DE AUTENTICACIÓN -->
    <div class="auth-section">
      <div id="auth-form">
        <h3>SYSTEM//ACCESS</h3>
        <input type="email" id="auth-email" placeholder="CORREO@CYBER.COM" class="neon-input">
        <input type="password" id="auth-password" placeholder="CONTRASEÑA" class="neon-input">
        <div class="auth-buttons">
          <button id="btn-login" class="neon-btn">LOGIN</button>
          <button id="btn-signup" class="neon-btn-secondary">REGISTRAR</button>
        </div>
        <p id="auth-status"></p>
      </div>

      <div id="user-info" style="display: none;" class="user-info">
        <p id="user-email">USER: UNKNOWN</p>
        <button id="btn-logout" class="neon-btn-danger">LOGOUT</button>
      </div>
    </div>

    <!-- REPRODUCTOR -->
    <div class="file-upload-wrapper">
      <label for="file-input" class="custom-file-btn">⚡ CARGAR AUDIO (.WAV / .FLAC)</label>
      <input type="file" id="file-input" accept="audio/*,.wav,.flac,.mp3" multiple>
    </div>

    <div class="track-info">
      <h2 id="track-title">SELECCIONA PISTA</h2>
      <p id="track-artist">SYSTEM//READY</p>
    </div>

    <div class="progress-container">
      <span id="current-time">0:00</span>
      <input type="range" id="progress-bar" value="0" min="0" step="0.1">
      <span id="total-duration">0:00</span>
    </div>

    <div class="controls">
      <button id="btn-prev">⏮</button>
      <button id="btn-play">▶ PLAY</button>
      <button id="btn-next">⏭</button>
    </div>

    <audio id="audio-player"></audio>

    <div class="playlist-container">
      <h3>PLAYLIST//CYBER</h3>
      <ul id="playlist"></ul>
    </div>
  </div>

  <script>
    // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = "https://supabase.com/dashboard/project/cwpjjzamawyywfcsnaqo/settings/api-keys"; 
    const SUPABASE_ANON_KEY = "sb_publishable_NynLf9J-n78PPW7Oaw2W1Q_0_kJjwtl"; 
    
    // Inicializar cliente
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Auth
    const authForm = document.getElementById("auth-form");
    const userInfo = document.getElementById("user-info");
    const userEmail = document.getElementById("user-email");
    const authStatus = document.getElementById("auth-status");
    const emailInput = document.getElementById("auth-email");
    const passwordInput = document.getElementById("auth-password");

    // REGISTRO
    document.getElementById("btn-signup").addEventListener("click", async () => {
      authStatus.innerText = "PROCESANDO...";
      const { data, error } = await supabaseClient.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value
      });
      if (error) authStatus.innerText = `ERR: ${error.message}`;
      else authStatus.innerText = "REGISTRO OK! REVISA TU EMAIL.";
    });

    // LOGIN
    document.getElementById("btn-login").addEventListener("click", async () => {
      authStatus.innerText = "VERIFICANDO...";
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value
      });
      if (error) authStatus.innerText = `ERR: ${error.message}`;
      else authStatus.innerText = "";
    });

    // LOGOUT
    document.getElementById("btn-logout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
    });

    // REVISAR ESTADO DE SESIÓN EN TIEMPO REAL
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        authForm.style.display = "none";
        userInfo.style.display = "block";
        userEmail.innerText = `ONLINE: ${session.user.email}`;
      } else {
        authForm.style.display = "block";
        userInfo.style.display = "none";
      }
    });

    // --- LÓGICA DEL REPRODUCTOR DE AUDIO ---
    const songs = []; 
    let currentSongIndex = 0; 
    let isPlaying = false;

    const audio = document.getElementById("audio-player");
    const title = document.getElementById("track-title");
    const artist = document.getElementById("track-artist");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalDurationEl = document.getElementById("total-duration");
    const playlistEl = document.getElementById("playlist");

    document.getElementById("file-input").addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      songs.length = 0;
      files.forEach(file => {
        songs.push({ 
          title: file.name.replace(/\.[^/.]+$/, ""), 
          artist: "AUDIO//LOCAL", 
          src: URL.createObjectURL(file) 
        });
      });

      renderPlaylist(); 
      currentSongIndex = 0; 
      loadSong(songs[0]);
      playSong();
    });

    function loadSong(song) { 
      if (!song) return; 
      title.innerText = song.title; 
      artist.innerText = song.artist;
      audio.src = song.src; 
      audio.load();
      updatePlaylistHighlight(); 
    }

    function playSong() { 
      if (songs.length === 0) return; 
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => { isPlaying = true; btnPlay.innerText = "⏸ PAUSE"; })
          .catch(() => { isPlaying = false; btnPlay.innerText = "▶ PLAY"; });
      }
    }

    function pauseSong() { 
      isPlaying = false; 
      btnPlay.innerText = "▶ PLAY"; 
      audio.pause(); 
    }

    btnPlay.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      isPlaying ? pauseSong() : playSong(); 
    });

    btnPrev.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length; 
      loadSong(songs[currentSongIndex]); 
      playSong(); 
    });

    btnNext.addEventListener("click", () => { 
      if (songs.length === 0) return; 
      currentSongIndex = (currentSongIndex + 1) % songs.length; 
      loadSong(songs[currentSongIndex]); 
      playSong(); 
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.innerText = formatTime(audio.currentTime);
        totalDurationEl.innerText = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => { 
      if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration; 
    });

    audio.addEventListener("ended", () => btnNext.click());

    function formatTime(s) { 
      const min = Math.floor(s / 60); 
      const sec = Math.floor(s % 60); 
      return `${min}:${sec < 10 ? '0' : ''}${sec}`; 
    }

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      songs.forEach((song, i) => {
        const li = document.createElement("li"); 
        li.innerText = `> ${song.title}`;
        li.addEventListener("click", () => { 
          currentSongIndex = i; 
          loadSong(songs[currentSongIndex]); 
          playSong(); 
        });
        playlistEl.appendChild(li);
      });
    }

    function updatePlaylistHighlight() {
      playlistEl.querySelectorAll("li").forEach((item, i) => { 
        i === currentSongIndex ? item.classList.add("active") : item.classList.remove("active"); 
      });
    }
  </script>
</body>
</html>
